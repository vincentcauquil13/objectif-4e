<title>Objectif 4e</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=DM+Mono:wght@400;500&display=swap">

<style>
  :root {
    --ink:        #16233A;
    --ink-soft:   #56658A;
    --paper:      #F1F4FA;
    --card:       #FFFFFF;
    --rule:       #D3DCEE;
    --rule-faint: #E2E8F4;
    --blue:       #1F44C4;
    --blue-wash:  #E6EBFB;
    --marker:     #FFD54A;
    --red:        #C9392A;
    --red-wash:   #FBE7E4;
    --green:      #1F7A5C;
    --green-wash: #DFF1EA;
    --shadow:     0 1px 0 var(--rule), 0 8px 24px -18px rgba(22,35,58,.55);

    --f-display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
    --f-body:    "Newsreader", Georgia, serif;
    --f-mono:    "DM Mono", ui-monospace, monospace;

    /* Une teinte par matière, en deux versions : -l pour un fond clair, -d pour un fond sombre.
       Chaque thème choisit ensuite le jeu qui va avec son fond (--c-*). */
    --maths-l:    #1F44C4;  --maths-d:    #8FA9FF;
    --francais-l: #7B3AA8;  --francais-d: #CDA4F7;
    --anglais-l:  #BE2A72;  --anglais-d:  #FF93C8;
    --histoire-l: #8F6410;  --histoire-d: #EAC15E;
    --sciences-l: #0E7A6B;  --sciences-d: #5FD9C0;
    --daily-l:    #C2410C;  --daily-d:    #FFA366;
  }
  /* jeu clair par défaut (les thèmes sombres le remplacent plus bas) */
  :root {
    --c-maths: var(--maths-l); --c-francais: var(--francais-l); --c-anglais: var(--anglais-l);
    --c-histoire: var(--histoire-l); --c-sciences: var(--sciences-l); --c-daily: var(--daily-l);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink:        #E7ECF7;
      --ink-soft:   #97A3BE;
      --paper:      #10151F;
      --card:       #18202E;
      --rule:       #2B3547;
      --rule-faint: #222B3A;
      --blue:       #8FA9FF;
      --blue-wash:  #1D2740;
      --marker:     #FFCE3C;
      --red:        #FF8878;
      --red-wash:   #3A2220;
      --green:      #6BD6B0;
      --green-wash: #16302A;
      --shadow:     0 1px 0 var(--rule), 0 10px 28px -20px #000;
      --c-maths: var(--maths-d); --c-francais: var(--francais-d); --c-anglais: var(--anglais-d);
      --c-histoire: var(--histoire-d); --c-sciences: var(--sciences-d); --c-daily: var(--daily-d);
    }
  }
  :root[data-theme="dark"] {
    --ink:        #E7ECF7;
    --ink-soft:   #97A3BE;
    --paper:      #10151F;
    --card:       #18202E;
    --rule:       #2B3547;
    --rule-faint: #222B3A;
    --blue:       #8FA9FF;
    --blue-wash:  #1D2740;
    --marker:     #FFCE3C;
    --red:        #FF8878;
    --red-wash:   #3A2220;
    --green:      #6BD6B0;
    --green-wash: #16302A;
    --shadow:     0 1px 0 var(--rule), 0 10px 28px -20px #000;
    --c-maths: var(--maths-d); --c-francais: var(--francais-d); --c-anglais: var(--anglais-d);
    --c-histoire: var(--histoire-d); --c-sciences: var(--sciences-d); --c-daily: var(--daily-d);
  }

  /* ---------- thèmes au choix ----------
     Placés après les blocs auto : un thème choisi l'emporte sur le clair/sombre du système. */
  :root[data-skin="nuit"] {
    --ink: #E7ECF7; --ink-soft: #97A3BE; --paper: #10151F; --card: #18202E;
    --rule: #2B3547; --rule-faint: #222B3A;
    --blue: #8FA9FF; --blue-wash: #1D2740; --marker: #FFCE3C;
    --red: #FF8878; --red-wash: #3A2220; --green: #6BD6B0; --green-wash: #16302A;
    --shadow: 0 1px 0 var(--rule), 0 10px 28px -20px #000;
    --c-maths: var(--maths-d); --c-francais: var(--francais-d); --c-anglais: var(--anglais-d);
    --c-histoire: var(--histoire-d); --c-sciences: var(--sciences-d); --c-daily: var(--daily-d);
  }
  :root[data-skin="neon"] {
    --ink: #F2E9FF; --ink-soft: #9E8CC4; --paper: #0B0714; --card: #150E24;
    --rule: #2E1F4C; --rule-faint: #1D1435;
    --blue: #35E0F0; --blue-wash: #0F2E38; --marker: #FF4FD8;
    --red: #FF5470; --red-wash: #33101C; --green: #6BFFB8; --green-wash: #0B3327;
    --shadow: 0 1px 0 var(--rule), 0 12px 30px -18px #35E0F0;
    --c-maths: var(--maths-d); --c-francais: var(--francais-d); --c-anglais: var(--anglais-d);
    --c-histoire: var(--histoire-d); --c-sciences: var(--sciences-d); --c-daily: var(--daily-d);
  }
  :root[data-skin="foret"] {
    --ink: #1B2A1F; --ink-soft: #5C6E5F; --paper: #EFF3EA; --card: #FFFFFF;
    --rule: #D2DCCE; --rule-faint: #E3EADD;
    --blue: #2E5D34; --blue-wash: #E2EDE1; --marker: #E9C46A;
    --red: #B0442F; --red-wash: #F6E3DE; --green: #5FA845; --green-wash: #E6F2DE;
    --shadow: 0 1px 0 var(--rule), 0 8px 24px -18px rgba(27,42,31,.5);
    --c-maths: var(--maths-l); --c-francais: var(--francais-l); --c-anglais: var(--anglais-l);
    --c-histoire: var(--histoire-l); --c-sciences: var(--sciences-l); --c-daily: var(--daily-l);
  }
  :root[data-skin="bonbon"] {
    --ink: #3A1B33; --ink-soft: #8A6580; --paper: #FDF0F6; --card: #FFFFFF;
    --rule: #F0D3E4; --rule-faint: #F7E4EF;
    --blue: #C6317F; --blue-wash: #FBE0EF; --marker: #FFD166;
    --red: #D6455B; --red-wash: #FBE2E6; --green: #2FA37D; --green-wash: #DDF3EC;
    --shadow: 0 1px 0 var(--rule), 0 8px 24px -18px rgba(58,27,51,.45);
    --c-maths: var(--maths-l); --c-francais: var(--francais-l); --c-anglais: var(--anglais-l);
    --c-histoire: var(--histoire-l); --c-sciences: var(--sciences-l); --c-daily: var(--daily-l);
  }
  :root[data-skin="volcan"] {
    --ink: #FBEDE4; --ink-soft: #B79A88; --paper: #17100D; --card: #221713;
    --rule: #3D2A22; --rule-faint: #2A1C17;
    --blue: #FF7A3D; --blue-wash: #3A2115; --marker: #FFC24D;
    --red: #FF6B6B; --red-wash: #3A1B1B; --green: #8FD694; --green-wash: #1E3320;
    --shadow: 0 1px 0 var(--rule), 0 10px 28px -20px #000;
    --c-maths: var(--maths-d); --c-francais: var(--francais-d); --c-anglais: var(--anglais-d);
    --c-histoire: var(--histoire-d); --c-sciences: var(--sciences-d); --c-daily: var(--daily-d);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--rule-faint) 1px, transparent 1px),
      linear-gradient(90deg, var(--rule-faint) 1px, transparent 1px);
    background-size: 100% 28px, 28px 100%;
    color: var(--ink);
    font-family: var(--f-body);
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    position: relative;
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 20px 80px;
    display: flex;
    flex-direction: column;
    gap: 26px;
  }

  /* Marge de cahier : filet rouge + perforations. Escamotée sous 900 px, faute de place. */
  .wrap::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0; left: -34px;
    width: 1px;
    background: var(--red);
    opacity: .35;
  }
  .holes {
    position: absolute;
    top: 90px; left: -64px;
    display: flex;
    flex-direction: column;
    gap: 150px;
    pointer-events: none;
  }
  .holes i {
    width: 17px; height: 17px;
    border-radius: 50%;
    background: var(--paper);
    box-shadow: inset 0 1px 3px rgba(0,0,0,.35);
    border: 1px solid var(--rule);
  }
  @media (max-width: 900px) {
    .wrap::before, .holes { display: none; }
  }

  /* Gribouillis : décor pur, jamais lu à voix haute par un lecteur d'écran. */
  .doodle { position: absolute; pointer-events: none; color: var(--blue); }
  .doodle svg { display: block; width: 100%; height: 100%; }
  .doodle path, .doodle circle, .doodle line, .doodle polyline, .doodle rect, .doodle ellipse {
    fill: none;
    stroke: currentColor;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ---------- en-tête ---------- */
  .masthead {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: end;
    gap: 18px 20px;
  }
  .hero-text { position: relative; display: flex; flex-direction: column; gap: 14px; }
  @media (max-width: 640px) {
    .masthead { grid-template-columns: 1fr; }
  }
  .eyebrow {
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0;
  }
  h1 {
    font-family: var(--f-display);
    font-weight: 800;
    font-size: clamp(38px, 9vw, 62px);
    line-height: .95;
    letter-spacing: -.03em;
    margin: 0;
    text-wrap: balance;
  }
  h1 .hl {
    background: linear-gradient(transparent 58%, var(--marker) 58%, var(--marker) 92%, transparent 92%);
    padding: 0 .06em;
  }
  .sub { margin: 0; color: var(--ink-soft); max-width: 46ch; }

  /* gribouillis autour du titre */
  .d-star { top: -16px; right: 0; width: 46px; height: 46px; color: var(--marker); opacity: .9; }
  .d-bolt { top: 62px; right: 66px; width: 24px; height: 32px; color: var(--ink-soft); opacity: .5; }
  @media (max-width: 560px) {
    .d-bolt { display: none; }
    .d-star { width: 42px; height: 42px; top: -2px; }
  }

  /* motif de fond des cartes matière */
  .subject { overflow: hidden; }
  .subject > span:not(.doodle) { position: relative; z-index: 1; }
  .d-card {
    right: -14px; bottom: -18px;
    width: 108px; height: 108px;
    opacity: .14;
    z-index: 0;
    transition: transform .3s ease, opacity .3s ease;
  }
  .subject:hover .d-card { transform: rotate(-8deg) scale(1.08); opacity: .22; }

  /* trombone en haut de la feuille de quiz */
  .sheet { position: relative; }
  .d-clip {
    top: -20px; left: 22px;
    width: 26px; height: 58px;
    color: var(--ink-soft);
    opacity: .55;
    z-index: 2;
  }

  /* tampon d'appréciation sur l'écran de résultat */
  .stamp {
    position: absolute;
    top: 14px; right: 10px;
    transform: rotate(-13deg);
    border: 3px double currentColor;
    border-radius: 6px;
    padding: 6px 12px 5px;
    font-family: var(--f-mono);
    font-size: 13px;
    letter-spacing: .18em;
    text-transform: uppercase;
    opacity: .8;
    pointer-events: none;
  }
  .stamp.ok   { color: var(--green); }
  .stamp.mid  { color: var(--marker); }
  .stamp.low  { color: var(--red); }
  @media (max-width: 560px) { .stamp { font-size: 11px; padding: 5px 9px 4px; top: 10px; right: 6px; } }

  /* arrivée des cartes en cascade */
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }
  /* backwards, pas both : sinon l'état final de l'animation écraserait le transform du survol */
  .subject { animation: rise .38s ease backwards; }
  .subject:nth-child(2) { animation-delay: .05s; }
  .subject:nth-child(3) { animation-delay: .1s; }
  .subject:nth-child(4) { animation-delay: .15s; }
  .subject:nth-child(5) { animation-delay: .2s; }

  /* ---------- la mascotte ----------
     Ses couleurs sont celles d'une vraie chouette hulotte : elles ne suivent pas le thème,
     sinon l'illustration perdrait son volume. */
  .owl-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
  .owl { display: block; overflow: visible; height: auto; }
  .owl-shadow { fill: #000; opacity: .22; }

  .owl .lid {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    transform: scaleY(0);
  }
  @keyframes blink {
    0%, 91%, 100% { transform: scaleY(0); }
    94%, 96%      { transform: scaleY(1); }
  }
  .owl[data-mood="idle"] .lid { animation: blink 6.4s infinite; }
  .owl[data-mood="idle"] .lid.right { animation-delay: .06s; }

  .owl .eye-happy { display: none; }
  .owl[data-mood="good"] .eye-happy,
  .owl[data-mood="win"]  .eye-happy { display: block; }
  .owl[data-mood="good"] .eye-open,
  .owl[data-mood="win"]  .eye-open { display: none; }

  .owl[data-mood="sad"] .lid { transform: scaleY(.62); }
  .owl .tear { display: none; }
  .owl[data-mood="sad"] .tear { display: block; animation: tear 2.6s ease-in infinite; }
  @keyframes tear {
    0%   { opacity: 0; transform: translateY(0); }
    18%  { opacity: .9; }
    100% { opacity: 0; transform: translateY(34px); }
  }

  .owl .wing { transform-box: fill-box; transform-origin: 70% 12%; }
  @keyframes flap  { from { transform: rotate(0); } to { transform: rotate(-26deg); } }
  @keyframes hop   { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-16px); } }
  @keyframes tilt  { 0%, 100% { transform: rotate(0); } 40% { transform: rotate(-5deg); } }
  .owl[data-mood="win"] .wing { animation: flap .34s ease-in-out 8 alternate; }
  .owl[data-mood="win"] .figure { animation: hop .68s ease-in-out 4; }
  .owl[data-mood="good"] .figure { transform-box: fill-box; transform-origin: 50% 90%; animation: tilt 1.1s ease; }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.018); } }
  .owl[data-mood="idle"] .figure { transform-box: fill-box; transform-origin: 50% 92%; animation: breathe 4.6s ease-in-out infinite; }

  /* la mascotte et sa bulle, sur l'accueil */
  .mascot { display: flex; align-items: flex-end; gap: 10px; }
  .mascot .owl { width: 132px; }
  .bubble {
    position: relative;
    align-self: center;
    max-width: 180px;
    background: var(--card);
    border: 1.5px solid var(--rule);
    border-radius: 12px 12px 12px 3px;
    padding: 9px 12px;
    font-size: 14px;
    line-height: 1.35;
    box-shadow: var(--shadow);
  }
  .bubble::after {
    content: "";
    position: absolute;
    right: -7px; bottom: 10px;
    width: 10px; height: 10px;
    background: var(--card);
    border-right: 1.5px solid var(--rule);
    border-top: 1.5px solid var(--rule);
    transform: rotate(45deg);
  }
  @media (max-width: 640px) {
    .mascot .owl { width: 104px; }
    .bubble { max-width: 210px; font-size: 13px; }
  }

  /* la mascotte qui commente la réponse, dans le quiz */
  .reaction { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
  .reaction .owl { width: 62px; flex: none; }
  .reaction .explain { flex: 1; }
  .verdict .owl { width: 126px; margin-bottom: -6px; }

  #confetti {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 60;
  }

  /* ---------- sélecteur de thème ---------- */
  .skins { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .skins .lab {
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-right: 2px;
  }
  .skin {
    width: 30px; height: 30px;
    padding: 0;
    border-radius: 50%;
    border: 2px solid var(--rule);
    cursor: pointer;
    position: relative;
    transition: transform .14s ease, border-color .14s ease;
  }
  .skin:hover { transform: scale(1.12); }
  .skin:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  .skin[aria-pressed="true"] {
    border-color: var(--ink);
    transform: scale(1.12);
  }
  .skin[aria-pressed="true"]::after {
    content: "";
    position: absolute;
    inset: -6px;
    border: 1px solid var(--ink-soft);
    border-radius: 50%;
  }
  .skin-name {
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--ink-soft);
    margin-left: 4px;
    min-width: 5.5em;
  }

  /* ---------- barre de score ---------- */
  .scorebar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .stat {
    flex: 1 1 120px;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 11px 13px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .stat .k {
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .stat .v {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 26px;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- cartes matières ---------- */
  .grid { display: grid; gap: 12px; }
  @media (min-width: 620px) { .grid { grid-template-columns: 1fr 1fr; } }

  .subject {
    position: relative;
    text-align: left;
    font: inherit;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 16px 18px 15px;
    cursor: pointer;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 9px;
    transition: transform .14s ease, border-color .14s ease;
  }
  .subject:hover { transform: translateY(-2px); border-color: var(--blue); }
  .subject:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  .subject .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .subject .name {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 21px;
    letter-spacing: -.01em;
    color: var(--blue);
  }
  .subject .badge {
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .subject .topics { font-size: 14px; color: var(--ink-soft); line-height: 1.45; }
  .track { height: 6px; background: var(--rule-faint); border-radius: 99px; overflow: hidden; }
  .track > i { display: block; height: 100%; background: var(--blue); border-radius: 99px; transition: width .5s ease; }
  .medal { font-size: 15px; }

  /* défi du jour : même carte, mais pleine largeur et bordure marquée */
  .subject.daily {
    border-color: var(--blue);
    border-width: 2px;
    background:
      linear-gradient(135deg, var(--blue-wash) 0%, var(--card) 55%);
  }
  .subject.daily .name { font-size: 23px; }

  /* barre de progression du niveau, dans la première tuile */
  .track.lvl { margin-top: 6px; margin-bottom: 3px; }

  /* ---------- onglets ---------- */
  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--rule);
  }
  .tab {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -.01em;
    color: var(--ink-soft);
    background: transparent;
    border: 1px solid transparent;
    border-bottom: none;
    border-radius: 3px 3px 0 0;
    padding: 9px 15px;
    cursor: pointer;
    position: relative;
    top: 1px;
  }
  .tab:hover { color: var(--ink); }
  .tab:focus-visible { outline: 3px solid var(--blue); outline-offset: -2px; }
  .tab.on {
    color: var(--ink);
    background: var(--card);
    border-color: var(--rule);
    box-shadow: 0 -2px 0 var(--blue) inset;
  }
  @media (max-width: 480px) { .tab { padding: 9px 10px; font-size: 14px; } }

  .pagehead { display: flex; flex-direction: column; gap: 10px; }
  .pagehead h1 {
    font-family: var(--f-display);
    font-weight: 800;
    font-size: clamp(30px, 7vw, 46px);
    line-height: 1;
    letter-spacing: -.03em;
    margin: 0;
  }

  /* ---------- mémento des formules ---------- */
  .fgrid { display: grid; gap: 12px; }
  /* minmax(0,…) : sans lui, la formule en nowrap élargirait la colonne et ferait
     déborder toute la page horizontalement. */
  @media (min-width: 700px) {
    .fgrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  }
  .fgroup {
    background: var(--card);

        e: "On additionne séparément les termes en x (5x − 2x = 3x) et les nombres (3 + 7 = 10)." },
      { d: 7, q: "Un triangle rectangle a pour côtés de l'angle droit 3 cm et 4 cm. Combien mesure l'hypoténuse ?", a: ["5 cm", "7 cm", "12 cm", "25 cm"], c: 0,
        e: "Pythagore : 3² + 4² = 9 + 16 = 25, donc l'hypoténuse vaut √25 = 5 cm." },
      { d: 7, q: "Dans un triangle rectangle, l'hypoténuse mesure 13 cm et un côté 5 cm. Combien mesure le troisième côté ?", a: ["12 cm", "8 cm", "18 cm", "144 cm"], c: 0,
        e: "Pythagore à l'envers : 13² − 5² = 169 − 25 = 144, donc le côté vaut √144 = 12 cm." },
      { d: 7, q: "Combien vaut (−2)³ ?", a: ["−8", "8", "−6", "6"], c: 0,
        e: "(−2) × (−2) × (−2) = 4 × (−2) = −8. Un exposant impair garde le signe moins." },
      { d: 7, q: "Combien vaut 10⁻³ ?", a: ["0,001", "−1 000", "0,0001", "−0,001"], c: 0,
        e: "10⁻³ = 1 ÷ 10³ = 1 ÷ 1 000 = 0,001. Un exposant négatif ne donne pas un nombre négatif." },
      { d: 7, q: "Combien fait 3/4 ÷ 2/5 ?", a: ["15/8", "6/20", "8/15", "5/6"], c: 0,
        e: "Diviser, c'est multiplier par l'inverse : 3/4 × 5/2 = 15/8." },
      { d: 7, q: "Une voiture roule à 80 km/h. Quelle distance parcourt-elle en 1 h 30 ?", a: ["120 km", "110 km", "80 km", "160 km"], c: 0,
        e: "1 h 30 = 1,5 h. Distance = 80 × 1,5 = 120 km. Attention : 1 h 30 n'est pas 1,30 h." },
      { d: 8, q: "Développe (x + 5)(x − 2).", a: ["x² + 3x − 10", "x² − 10", "x² + 7x − 10", "x² + 3x + 10"], c: 0,
        e: "Double distributivité : x² − 2x + 5x − 10 = x² + 3x − 10." },
      { d: 8, q: "Factorise 3x + 6.", a: ["3(x + 2)", "3(x + 6)", "x(3 + 6)", "3x(1 + 2)"], c: 0,
        e: "Le facteur commun est 3 : 3x + 6 = 3 × x + 3 × 2 = 3(x + 2)." },
      { d: 8, q: "Un triangle a pour côtés 6, 8 et 10 cm. Que peut-on en dire ?", a: ["il est rectangle", "il est équilatéral", "il est isocèle", "il n'existe pas"], c: 0,
        e: "Réciproque de Pythagore : 6² + 8² = 36 + 64 = 100 = 10². Le triangle est donc rectangle." },
      { d: 8, q: "On lance un dé à 6 faces. Quelle est la probabilité d'obtenir un nombre pair ?", a: ["1/2", "1/3", "1/6", "2/3"], c: 0,
        e: "Trois faces sont paires (2, 4, 6) sur six : 3/6 = 1/2." },
      { d: 8, q: "Développe (x + 3)².", a: ["x² + 6x + 9", "x² + 9", "x² + 3x + 9", "2x + 6"], c: 0,
        e: "(x + 3)² = (x + 3)(x + 3) = x² + 3x + 3x + 9 = x² + 6x + 9. Le double produit s'oublie souvent." },
      { d: 8, q: "Combien vaut √144 ?", a: ["12", "72", "14", "24"], c: 0,
        e: "12 × 12 = 144, donc √144 = 12." },
      { d: 9, q: "Dans un triangle rectangle, le cosinus d'un angle aigu est égal à…", a: ["côté adjacent ÷ hypoténuse", "côté opposé ÷ hypoténuse", "hypoténuse ÷ côté adjacent", "côté opposé ÷ côté adjacent"], c: 0,
        e: "Moyen mnémotechnique CAH : Cosinus = Adjacent sur Hypoténuse." },
      { d: 9, q: "Combien vaut 10⁵ × 10³ ?", a: ["10⁸", "10¹⁵", "20⁸", "10²"], c: 0,
        e: "On additionne les exposants quand on multiplie des puissances du même nombre : 5 + 3 = 8." },
      { d: 9, q: "Résous l'équation x/3 = 5/6.", a: ["x = 5/2", "x = 2/5", "x = 18/5", "x = 15"], c: 0,
        e: "Produit en croix : 6x = 15, donc x = 15/6 = 5/2 (soit 2,5)." },
      { d: 9, q: "Dans un jeu de 32 cartes, quelle est la probabilité de tirer un roi ?", a: ["1/8", "1/32", "1/4", "1/16"], c: 0,
        e: "Il y a 4 rois sur 32 cartes : 4/32, qu'on simplifie en 1/8." },
      { d: 9, q: "Écris 45 000 en notation scientifique.", a: ["4,5 × 10⁴", "45 × 10³", "4,5 × 10⁵", "0,45 × 10⁵"], c: 0,
        e: "La notation scientifique impose un seul chiffre non nul avant la virgule : 4,5 × 10⁴." },
      { d: 10, q: "Quelle est la longueur de la diagonale d'un rectangle de 6 cm sur 8 cm ?", a: ["10 cm", "14 cm", "48 cm", "7 cm"], c: 0,
        e: "La diagonale coupe le rectangle en deux triangles rectangles : 6² + 8² = 100, donc √100 = 10 cm." },
      { d: 10, q: "Développe (2x + 1)(x − 3).", a: ["2x² − 5x − 3", "2x² − 3", "2x² + 5x − 3", "2x² − 6x + 1"], c: 0,
        e: "2x² − 6x + x − 3 = 2x² − 5x − 3. Le piège est d'oublier de réduire −6x + x." },
      { d: 10, q: "Écris 0,00042 en notation scientifique.", a: ["4,2 × 10⁻⁴", "4,2 × 10⁴", "42 × 10⁻⁵", "0,42 × 10⁻³"], c: 0,
        e: "La virgule se déplace de 4 rangs vers la droite, donc l'exposant est −4." },
      { d: 10, q: "Combien de temps faut-il pour parcourir 15 km à 20 km/h ?", a: ["45 min", "1 h 15", "30 min", "1 h 20"], c: 0,
        e: "Temps = distance ÷ vitesse = 15 ÷ 20 = 0,75 h, soit 45 minutes." },
      { d: 10, q: "Dans une classe, 12 élèves ont eu 10 et 8 élèves ont eu 15. Quelle est la moyenne ?", a: ["12", "12,5", "11", "13"], c: 0,
        e: "Moyenne pondérée : (12 × 10 + 8 × 15) ÷ 20 = (120 + 120) ÷ 20 = 12." },
      { d: 8, q: "Quand peut-on appliquer le théorème de Thalès ?", a: ["quand deux droites parallèles coupent deux sécantes", "quand le triangle est rectangle", "quand le triangle est isocèle", "quand les angles sont égaux"], c: 0,
        e: "Il faut deux droites parallèles et deux sécantes : on obtient alors deux triangles emboîtés dont les longueurs sont proportionnelles." },
      { d: 8, q: "Dans une configuration de Thalès, AM = 3 cm, AB = 9 cm et MN = 4 cm. Combien mesure BC ?", a: ["12 cm", "6 cm", "10 cm", "1,33 cm"], c: 0,
        e: "AM/AB = 3/9 = 1/3, donc MN/BC = 1/3. Si MN = 4, alors BC = 4 × 3 = 12 cm." },
      { d: 9, q: "Dans une configuration de Thalès, AM/AB = 1/4 et BC = 20 cm. Combien mesure MN ?", a: ["5 cm", "80 cm", "16 cm", "4 cm"], c: 0,
        e: "Les rapports sont égaux : MN/BC = 1/4, donc MN = 20 ÷ 4 = 5 cm." },
      { d: 9, q: "Que permet de démontrer la réciproque du théorème de Thalès ?", a: ["que deux droites sont parallèles", "qu'un triangle est rectangle", "que deux triangles sont égaux", "qu'un angle est droit"], c: 0,
        e: "Si les rapports de longueurs sont égaux et les points bien placés, alors les droites sont parallèles." },
      { d: 9, q: "Dans un triangle rectangle, le côté adjacent mesure 4 cm et l'hypoténuse 5 cm. Que vaut le cosinus de l'angle ?", a: ["0,8", "1,25", "0,6", "20"], c: 0,
        e: "cos = adjacent ÷ hypoténuse = 4 ÷ 5 = 0,8. L'angle mesure alors environ 37°." },
      { d: 10, q: "Le cosinus d'un angle aigu est toujours…", a: ["compris entre 0 et 1", "supérieur à 1", "négatif", "égal à l'angle"], c: 0,
        e: "L'adjacent est toujours plus court que l'hypoténuse, donc le quotient est inférieur à 1." },
      { d: 5, q: "Deux angles opposés par le sommet sont…", a: ["égaux", "supplémentaires", "complémentaires", "toujours droits"], c: 0,
        e: "Deux droites sécantes forment deux paires d'angles opposés par le sommet, égaux deux à deux." },
      { d: 6, q: "Une translation transforme une figure en…", a: ["une figure identique qui a glissé", "une figure agrandie", "une figure retournée", "un point"], c: 0,
        e: "La translation glisse la figure selon une direction, un sens et une longueur. Elle conserve tout : longueurs, angles et aires." }
    ],

    francais: [
      { d: 4, q: "Dans « le livre que je lis », quelle est la classe de « que » ?", a: ["pronom relatif", "conjonction", "adverbe", "préposition"], c: 0,
        e: "Il relie la subordonnée à son antécédent « le livre » : c'est un pronom relatif." },
      { d: 4, q: "Conjugue « aller » au futur simple, 1ʳᵉ personne du singulier.", a: ["j'irai", "j'irais", "j'allai", "je vais"], c: 0,
        e: "« J'irai » (futur) ne prend pas de -s ; « j'irais » avec -s est du conditionnel." },
      { d: 4, q: "Dans « Il court dans le jardin », quelle est la fonction de « dans le jardin » ?", a: ["complément circonstanciel de lieu", "COD", "COI", "attribut du sujet"], c: 0,
        e: "Il répond à la question « où ? » et peut être déplacé ou supprimé : c'est un complément circonstanciel." },
      { d: 5, q: "Dans « Il est médecin », quelle est la fonction de « médecin » ?", a: ["attribut du sujet", "COD", "complément du nom", "apposition"], c: 0,
        e: "Il est relié au sujet par le verbe d'état « être » : c'est un attribut du sujet, jamais un COD." },
      { d: 5, q: "Quel est le passé simple de « prendre » à la 3ᵉ personne du singulier ?", a: ["il prit", "il prend", "il prenait", "il prendra"], c: 0,
        e: "Passé simple : je pris, tu pris, il prit, nous prîmes, vous prîtes, ils prirent." },
      { d: 5, q: "« Je meurs de faim ! » De quelle figure de style s'agit-il ?", a: ["une hyperbole", "une litote", "une métaphore", "une comparaison"], c: 0,
        e: "L'hyperbole exagère pour frapper l'esprit. Personne ne meurt vraiment de faim en rentrant du collège." },
      { d: 5, q: "« Le vent hurlait dans la nuit. » De quelle figure de style s'agit-il ?", a: ["une personnification", "une comparaison", "une litote", "une antithèse"], c: 0,
        e: "On prête au vent une action humaine (hurler) : c'est une personnification." },
      { d: 5, q: "Quel est le comparatif employé dans « Il est plus rapide que moi » ?", a: ["un comparatif de supériorité", "un superlatif", "un comparatif d'égalité", "un comparatif d'infériorité"], c: 0,
        e: "« Plus… que » marque la supériorité ; « aussi… que » l'égalité ; « moins… que » l'infériorité." },
      { d: 6, q: "Mets au discours indirect : Il dit : « Je viens demain. »", a: ["Il dit qu'il vient le lendemain", "Il dit que je viens demain", "Il dit : il vient demain", "Il dit qu'il viendra demain matin"], c: 0,
        e: "On change la personne (je → il) et l'indicateur de temps (demain → le lendemain), et on supprime les guillemets." },
      { d: 6, q: "Complète : « Il faut que je ___ à l'heure. »", a: ["sois", "suis", "serai", "étais"], c: 0,
        e: "Après « il faut que », on emploie le subjonctif présent : que je sois." },
      { d: 6, q: "Conjugue « pouvoir » au conditionnel présent, 1ʳᵉ personne du singulier.", a: ["je pourrais", "je pourrai", "je peux", "je pus"], c: 0,
        e: "Conditionnel : radical du futur + terminaisons de l'imparfait. « Je pourrai » sans -s serait du futur." },
      { d: 6, q: "Un mot polysémique est un mot qui…", a: ["a plusieurs sens", "a plusieurs syllabes", "vient du grec", "n'a pas de contraire"], c: 0,
        e: "« Glace » peut désigner un miroir, un dessert ou de l'eau gelée : le contexte tranche." },
      { d: 7, q: "Dans « Je pense qu'il a raison », quelle est la nature de la subordonnée ?", a: ["une subordonnée complétive (COD)", "une subordonnée relative", "une subordonnée circonstancielle", "une proposition indépendante"], c: 0,
        e: "Elle complète le verbe « pense » et répond à « je pense quoi ? » : c'est une complétive, COD du verbe." },
      { d: 7, q: "« Il a dit qu'il viendrait. » Quelle est la valeur de ce conditionnel ?", a: ["un futur dans le passé", "une hypothèse", "un regret", "un ordre atténué"], c: 0,
        e: "Quand le verbe introducteur est au passé, le futur devient conditionnel : c'est la concordance des temps." },
      { d: 7, q: "« Cette obscure clarté qui tombe des étoiles. » De quelle figure s'agit-il ?", a: ["un oxymore", "une hyperbole", "une métonymie", "une anaphore"], c: 0,
        e: "L'oxymore rapproche deux mots de sens contraires. Le vers est de Corneille." },
      { d: 7, q: "Quelle est la valeur du plus-que-parfait dans « Il avait fini quand je suis arrivé » ?", a: ["l'antériorité par rapport à un autre passé", "une action en cours", "une habitude", "un futur proche"], c: 0,
        e: "Le plus-que-parfait situe une action avant une autre action passée." },
      { d: 7, q: "Transforme à la voix passive : « Le chat mange la souris. »", a: ["La souris est mangée par le chat", "La souris mange le chat", "Le chat est mangé par la souris", "La souris a été mangée"], c: 0,
        e: "Le COD devient sujet, le sujet devient complément d'agent, et le verbe passe à l'auxiliaire être." },
      { d: 8, q: "« Va, je ne te hais point. » De quelle figure de style s'agit-il ?", a: ["une litote", "une hyperbole", "une ironie", "une périphrase"], c: 0,
        e: "La litote dit peu pour suggérer beaucoup : Chimène avoue en réalité son amour." },
      { d: 8, q: "Dans « Épuisé, il s'assit », quelle est la fonction de « épuisé » ?", a: ["épithète détachée (apposée)", "attribut du sujet", "COD", "complément circonstanciel"], c: 0,
        e: "L'adjectif est séparé du nom par une virgule : il est apposé, aussi appelé épithète détachée." },
      { d: 8, q: "« Il est resté parce qu'il pleuvait. » Quelle est la nature de la subordonnée ?", a: ["circonstancielle de cause", "circonstancielle de but", "relative", "complétive"], c: 0,
        e: "« Parce que » introduit la cause. Le but serait introduit par « pour que »." },
      { d: 8, q: "Un narrateur qui connaît les pensées de tous les personnages adopte…", a: ["le point de vue omniscient", "le point de vue interne", "le point de vue externe", "le discours direct"], c: 0,
        e: "Interne : on suit un seul personnage. Externe : on ne voit que l'extérieur, comme une caméra." },
      { d: 8, q: "« Boire un verre » : de quelle figure s'agit-il ?", a: ["une métonymie", "une métaphore", "une hyperbole", "une comparaison"], c: 0,
        e: "La métonymie désigne une chose par une autre qui lui est liée : le contenant pour le contenu." },
      { d: 9, q: "Complète : « Bien qu'il ___ fatigué, il continue. »", a: ["soit", "est", "sera", "était"], c: 0,
        e: "« Bien que » est toujours suivi du subjonctif, même si la chose est bien réelle." },
      { d: 9, q: "Répéter un même mot en début de plusieurs vers ou phrases s'appelle…", a: ["une anaphore", "une allitération", "une gradation", "une antithèse"], c: 0,
        e: "« Rome, l'unique objet… » L'anaphore martèle et donne du rythme." },
      { d: 9, q: "« L'astre du jour » pour désigner le soleil est…", a: ["une périphrase", "une métonymie", "une litote", "un euphémisme"], c: 0,
        e: "La périphrase remplace un mot par une expression qui le décrit." },
      { d: 9, q: "Dans « Il entra. Que faire maintenant ? Il hésitait. », la question est au…", a: ["discours indirect libre", "discours direct", "discours indirect", "discours narrativisé"], c: 0,
        e: "Les pensées du personnage se glissent dans le récit sans guillemets ni « que » : c'est le discours indirect libre." },
      { d: 9, q: "« Elle s'est lavé les mains. » Pourquoi « lavé » ne s'accorde-t-il pas ?", a: ["le COD « les mains » est placé après le verbe", "le sujet est féminin", "le verbe est pronominal", "c'est une exception"], c: 0,
        e: "Avec un verbe pronominal, on accorde avec le COD seulement s'il précède le verbe. Ici il suit." },
      { d: 10, q: "« Je me meurs, je suis mort, je suis enseveli. » De quelle figure s'agit-il ?", a: ["une gradation", "une anaphore", "un oxymore", "une litote"], c: 0,
        e: "La gradation enchaîne des termes d'intensité croissante." },
      { d: 10, q: "« Ici l'ombre, là la lumière. » De quelle figure s'agit-il ?", a: ["une antithèse", "un oxymore", "une métaphore", "une périphrase"], c: 0,
        e: "L'antithèse oppose deux termes dans la même phrase. L'oxymore, lui, les colle l'un à l'autre." },
      { d: 10, q: "Dans un récit au passé, un verbe au présent sert souvent à…", a: ["rendre la scène plus vivante (présent de narration)", "indiquer une habitude", "marquer une erreur de temps", "exprimer le futur"], c: 0,
        e: "Le présent de narration met l'action sous les yeux du lecteur, comme si elle se déroulait maintenant." },
      { d: 10, q: "La répétition d'un même son consonne dans un vers s'appelle…", a: ["une allitération", "une assonance", "une anaphore", "une rime"], c: 0,
        e: "Allitération pour les consonnes (« Pour qui sont ces serpents… »), assonance pour les voyelles." },
      { d: 10, q: "Dans « Quelle chance, il pleut le jour du match ! », le registre est…", a: ["ironique", "pathétique", "épique", "comique"], c: 0,
        e: "L'ironie dit le contraire de ce qu'on pense pour se moquer de la situation." },
      { d: 6, q: "Quel est le mode du verbe dans « Prends ton cartable » ?", a: ["l'impératif", "l'indicatif", "le subjonctif", "l'infinitif"], c: 0,
        e: "L'impératif donne un ordre et se conjugue sans sujet exprimé." },
      { d: 5, q: "Quel est le synonyme le plus juste de « éphémère » ?", a: ["passager", "éternel", "immense", "fragile"], c: 0,
        e: "Éphémère = qui ne dure pas. Le contraire serait durable ou éternel." },
      { d: 4, q: "Quelle est la classe grammaticale de « celui-ci » ?", a: ["pronom démonstratif", "adjectif démonstratif", "nom commun", "adverbe"], c: 0,
        e: "Il remplace un nom : c'est un pronom. « Ce livre-ci » serait un adjectif démonstratif." }
    ],

    anglais: [
      { d: 4, q: "Complète : « I don't have ___ money. »", a: ["any", "some", "much of", "a"], c: 0,
        e: "« Some » à la forme affirmative, « any » à la forme négative et interrogative." },
      { d: 4, q: "Complète : « ___ apples do you want? »", a: ["How many", "How much", "How long", "How often"], c: 0,
        e: "« How many » pour ce qui se compte (apples), « how much » pour ce qui ne se compte pas (water)." },
      { d: 4, q: "Comment dit-on « la voiture de mon père » ?", a: ["my father's car", "the car of my father", "my father car", "the father's my car"], c: 0,
        e: "Le génitif : possesseur + 's + objet possédé." },
      { d: 5, q: "Complète : « I was born ___ 2013. »", a: ["in", "on", "at", "for"], c: 0,
        e: "« In » pour les années et les mois, « on » pour les jours, « at » pour les heures." },
      { d: 5, q: "Complète : « She is ___ tall as her brother. »", a: ["as", "so", "more", "than"], c: 0,
        e: "Comparatif d'égalité : as + adjectif + as." },
      { d: 5, q: "Où placer l'adverbe : « I ___ go to bed late. » (souvent)", a: ["often", "very", "always the", "much"], c: 0,
        e: "Les adverbes de fréquence (often, always, never) se placent avant le verbe principal." },
      { d: 5, q: "Complète : « There ___ a lot of people yesterday. »", a: ["were", "was", "are", "is"], c: 0,
        e: "« People » est un pluriel, et l'action est passée : there were." },
      { d: 6, q: "Quel est le participe passé de « take » ?", a: ["taken", "took", "taked", "taking"], c: 0,
        e: "take / took / taken. « Took » est le prétérit, « taken » s'emploie avec have." },
      { d: 6, q: "Complète : « I have lived here ___ 2019. »", a: ["since", "for", "during", "from"], c: 0,
        e: "« Since » + point de départ (2019, Monday) ; « for » + durée (three years)." },
      { d: 6, q: "Complète : « She ___ never been to London. »", a: ["has", "have", "is", "was"], c: 0,
        e: "Present perfect à la 3ᵉ personne du singulier : she has been." },
      { d: 6, q: "Que signifie « I used to play football » ?", a: ["je jouais au football (avant)", "j'utilise le football", "je joue au football", "j'ai besoin de jouer"], c: 0,
        e: "« Used to » exprime une habitude passée qui n'existe plus." },
      { d: 7, q: "Complète : « I ___ my keys. I can't open the door. »", a: ["have lost", "lost", "am losing", "was losing"], c: 0,
        e: "Le present perfect relie le passé au présent : la conséquence est actuelle." },
      { d: 7, q: "Complète : « I ___ TV when the phone rang. »", a: ["was watching", "watched", "am watching", "have watched"], c: 0,
        e: "Past continuous pour l'action en cours, prétérit simple pour l'action qui l'interrompt." },
      { d: 7, q: "Complète : « This is the man ___ lives next door. »", a: ["who", "which", "whose", "what"], c: 0,
        e: "« Who » pour les personnes, « which » pour les choses, « whose » pour la possession." },
      { d: 7, q: "Complète : « Look at the clouds! It ___ rain. »", a: ["is going to", "will", "would", "used to"], c: 0,
        e: "« Be going to » quand un indice présent annonce l'événement ; « will » pour une décision sur le moment." },
      { d: 7, q: "Quel est le prétérit de « to think » ?", a: ["thought", "thinked", "thinks", "thinking"], c: 0,
        e: "think / thought / thought. Même famille que buy / bought." },
      { d: 8, q: "Complète : « If it rains tomorrow, we ___ at home. »", a: ["will stay", "would stay", "stayed", "will to stay"], c: 0,
        e: "Conditionnel de type 1 : If + présent, will + base verbale. Jamais de « will » après « if »." },
      { d: 8, q: "Complète : « You ___ see a doctor, you look ill. »", a: ["should", "would", "could", "may"], c: 0,
        e: "« Should » donne un conseil ; « must » exprimerait une obligation forte." },
      { d: 8, q: "Quelle phrase est correcte ?", a: ["It's the most interesting book", "It's the interestingest book", "It's the more interesting book", "It's most interesting book"], c: 0,
        e: "Adjectif long : the most + adjectif. Adjectif court : -est (the biggest)." },
      { d: 8, q: "Que signifie « You don't have to come » ?", a: ["tu n'es pas obligé de venir", "tu ne dois pas venir", "il est interdit de venir", "tu ne peux pas venir"], c: 0,
        e: "« Don't have to » = absence d'obligation. L'interdiction, c'est « mustn't »." },
      { d: 8, q: "Complète : « The Mona Lisa ___ by Leonardo da Vinci. »", a: ["was painted", "painted", "is painting", "has painted"], c: 0,
        e: "Passif au prétérit : was/were + participe passé." },
      { d: 9, q: "Complète : « If I ___ rich, I would travel the world. »", a: ["were", "am", "will be", "would be"], c: 0,
        e: "Conditionnel de type 2 (situation imaginaire) : If + prétérit, would + base verbale. « Were » à toutes les personnes." },
      { d: 9, q: "Complète : « This car isn't cheap ___ for me. »", a: ["enough", "too", "very", "so"], c: 0,
        e: "« Enough » se place après l'adjectif ; « too » se place avant (too expensive)." },
      { d: 9, q: "Que signifie « to look after someone » ?", a: ["s'occuper de quelqu'un", "chercher quelqu'un", "regarder après", "ressembler à quelqu'un"], c: 0,
        e: "Look after = prendre soin de. Look for = chercher. Look like = ressembler à." },
      { d: 9, q: "Complète : « Cheese ___ from milk. »", a: ["is made", "makes", "is making", "made"], c: 0,
        e: "Passif au présent : is/are + participe passé." },
      { d: 9, q: "Complète : « I've been waiting ___ two hours. »", a: ["for", "since", "during", "from"], c: 0,
        e: "Une durée chiffrée appelle « for »." },
      { d: 10, q: "Discours rapporté : He said: « I am tired. » devient…", a: ["He said he was tired", "He said I am tired", "He said he is tired", "He says he was tired"], c: 0,
        e: "Au discours rapporté avec un verbe au passé, le présent devient prétérit et « I » devient « he »." },
      { d: 10, q: "Quelle est la différence entre « I like coffee » et « I'd like a coffee » ?", a: ["le second exprime une envie sur le moment", "les deux sont identiques", "le second est au passé", "le premier est une demande polie"], c: 0,
        e: "« I like » = goût général. « I would like » = je voudrais, maintenant." },
      { d: 10, q: "Complète : « She asked me ___ I was going. »", a: ["where", "where was", "that where", "which"], c: 0,
        e: "Dans une question rapportée, on garde l'ordre sujet + verbe : où j'allais, pas « where was I »." },
      { d: 10, q: "Que signifie « I can't stand it » ?", a: ["je ne le supporte pas", "je ne peux pas rester debout", "je ne comprends pas", "je ne peux pas l'atteindre"], c: 0,
        e: "« Can't stand » est une expression idiomatique : détester profondément." },
      { d: 10, q: "Complète : « By the time we arrived, the film ___ started. »", a: ["had", "has", "was", "would have"], c: 0,
        e: "Past perfect (had + participe passé) : une action antérieure à une autre action passée." },
      { d: 6, q: "Complète : « He is good ___ maths. »", a: ["at", "in", "on", "with"], c: 0,
        e: "L'expression figée est « to be good at something »." },
      { d: 5, q: "Quel est le pluriel de « woman » ?", a: ["women", "womans", "womens", "womanes"], c: 0,
        e: "Pluriel irrégulier, qui se prononce d'ailleurs différemment : /ˈwɪmɪn/." },
      { d: 4, q: "Complète : « ___ she like chocolate? »", a: ["Does", "Do", "Is", "Has"], c: 0,
        e: "3ᵉ personne du singulier au present simple : l'auxiliaire est « does », et le verbe reste nu." }
    ],

    histoire: [
      { d: 4, q: "Quel conflit oppose la France et l'Angleterre de 1337 à 1453 ?", a: ["la guerre de Cent Ans", "les croisades", "la guerre de Trente Ans", "la guerre des Deux-Roses"], c: 0,

      { d: 5, q: "Que garantit l'édit de Nantes signé en 1598 ?", a: ["la liberté de culte aux protestants", "la fin de la guerre de Cent Ans", "l'abolition de l'esclavage", "le pouvoir du Parlement"], c: 0,

      { d: 5, q: "Qu'est-ce que le développement durable ?", a: ["répondre aux besoins actuels sans compromettre ceux des générations futures", "produire toujours plus", "protéger uniquement la nature", "développer les pays pauvres"], c: 0,

      { d: 6, q: "Qu'est-ce que la traite atlantique ?", a: ["la déportation d'Africains réduits en esclavage vers l'Amérique", "le commerce des épices", "un traité de paix", "une route maritime vers l'Asie"], c: 0,

      { d: 6, q: "Qu'est-ce que la monarchie absolue ?", a: ["un régime où le roi détient tous les pouvoirs", "un régime où le roi partage le pouvoir avec un parlement", "une république", "un pouvoir exercé par l'Église"], c: 0,
        e: "Le roi tient son pouvoir de Dieu et ne le partage pas. En Angleterre, la monarchie devient au contraire parlementaire." },
      { d: 6, q: "Qui dirige la rédaction de l'Encyclopédie au XVIIIᵉ siècle ?", a: ["Diderot et d'Alembert", "Voltaire et Rousseau", "Montesquieu", "Buffon"], c: 0,

      { d: 6, q: "Que mesure-t-on avec le PIB ?", a: ["les richesses produites dans un pays en un an", "le nombre d'habitants", "l'espérance de vie", "le niveau d'éducation"], c: 0,
        e: "Le PIB mesure la production, pas le bien-être ni les inégalités. L'IDH complète ce regard." },
      { d: 7, q: "Que se passe-t-il le 14 juillet 1789 ?", a: ["la prise de la Bastille", "la fuite du roi à Varennes", "la proclamation de la République", "l'exécution de Louis XVI"], c: 0,

      { d: 7, q: "Quand est votée la Déclaration des droits de l'homme et du citoyen ?", a: ["le 26 août 1789", "le 14 juillet 1789", "en 1792", "en 1804"], c: 0,

      { d: 7, q: "En quelle année la République est-elle proclamée en France ?", a: ["1792", "1789", "1793", "1799"], c: 0,

      { d: 7, q: "Qu'est-ce que la nuit du 4 août 1789 ?", a: ["l'abolition des privilèges", "la prise de la Bastille", "la fuite du roi", "le sacre de Napoléon"], c: 0,

      { d: 8, q: "Comment Napoléon Bonaparte prend-il le pouvoir en 1799 ?", a: ["par le coup d'État du 18 Brumaire", "par une élection", "par héritage", "par un vote de l'Assemblée"], c: 0,

      { d: 8, q: "Quel code, promulgué en 1804, unifie le droit français ?", a: ["le Code civil", "le Code noir", "la Constitution", "le Code pénal"], c: 0,

      { d: 8, q: "Où Napoléon est-il définitivement vaincu en 1815 ?", a: ["à Waterloo", "à Austerlitz", "à Trafalgar", "à Iéna"], c: 0,

      { d: 8, q: "Qu'est-ce que le suffrage universel masculin, instauré en France en 1848 ?", a: ["le droit de vote pour tous les hommes adultes", "le droit de vote pour tous", "le vote réservé aux plus riches", "le vote des femmes"], c: 0,
        e: "Il supprime le suffrage censitaire réservé aux contribuables aisés. Les femmes devront attendre 1944." },
      { d: 9, q: "Quelle invention symbolise la révolution industrielle du XIXᵉ siècle ?", a: ["la machine à vapeur", "l'imprimerie", "l'ordinateur", "le moteur électrique"], c: 0,
        e: "Elle fait tourner usines, trains et navires, et repose sur le charbon." },
      { d: 9, q: "Qu'est-ce que l'exode rural ?", a: ["le départ des campagnes vers les villes", "l'arrivée d'étrangers", "la fuite devant une guerre", "le retour à la campagne"], c: 0,
        e: "Au XIXᵉ siècle, les paysans partent travailler dans les usines : les villes explosent." },
      { d: 9, q: "Comment appelle-t-on les ouvriers d'usine du XIXᵉ siècle ?", a: ["le prolétariat", "la bourgeoisie", "l'aristocratie", "la paysannerie"], c: 0,
        e: "Ils n'ont que leur force de travail. Face à eux, la bourgeoisie possède les usines et le capital." },
      { d: 9, q: "Qui écrit le Manifeste du parti communiste en 1848 ?", a: ["Marx et Engels", "Jules Ferry", "Victor Hugo", "Émile Zola"], c: 0,
        e: "Ils y analysent la lutte des classes née de l'industrialisation." },
      { d: 10, q: "Que décide la conférence de Berlin de 1884-1885 ?", a: ["le partage de l'Afrique entre puissances européennes", "la fin de l'esclavage", "la création de la SDN", "l'indépendance des colonies"], c: 0,

      { d: 10, q: "Qu'est-ce que la mondialisation ?", a: ["la mise en relation croissante des territoires du monde", "la domination d'un seul pays", "la disparition des frontières", "l'uniformisation des langues"], c: 0,

      { d: 10, q: "Qu'appelle-t-on la littoralisation des activités ?", a: ["la concentration des hommes et des activités près des côtes", "la protection des littoraux", "l'érosion des plages", "le tourisme balnéaire"], c: 0,
        e: "Ports, zones industrielles et grandes villes se massent sur les façades maritimes, portes d'entrée du commerce mondial." },
      { d: 10, q: "Quelle est la première destination touristique mondiale ?", a: ["la France", "les États-Unis", "l'Espagne", "la Chine"], c: 0,
        e: "La France accueille le plus de touristes internationaux, même si les États-Unis en tirent plus de recettes." },
      { d: 10, q: "Qu'est-ce qu'une firme transnationale ?", a: ["une entreprise implantée dans plusieurs pays", "une entreprise d'État", "une banque internationale", "une organisation humanitaire"], c: 0,

      { d: 6, q: "Qu'est-ce qu'un pays émergent ?", a: ["un pays en forte croissance économique, entre pauvreté et richesse", "un pays très pauvre", "un pays le plus riche du monde", "un pays sans industrie"], c: 0,

      { d: 5, q: "Qu'est-ce qu'une métropole ?", a: ["une grande ville qui concentre les fonctions de commandement", "une ville de plus de 10 millions d'habitants", "la capitale d'un pays", "une ville portuaire"], c: 0,

      { d: 4, q: "Qu'est-ce qu'une seigneurie au Moyen Âge ?", a: ["le domaine sur lequel un seigneur exerce son autorité", "une abbaye", "une ville libre", "un royaume"], c: 0,

    sciences: [
      { d: 4, q: "Quel est le rôle du cœur ?", a: ["mettre le sang en mouvement dans les vaisseaux", "produire le sang", "filtrer le sang", "fabriquer l'oxygène"], c: 0,
        e: "C'est une pompe musculaire : le sang part par les artères et revient par les veines." },
      { d: 4, q: "Que consomment les muscles en fonctionnant ?", a: ["du dioxygène et des nutriments", "du dioxyde de carbone", "de l'eau uniquement", "des vitamines seulement"], c: 0,
        e: "Ils libèrent l'énergie des nutriments grâce au dioxygène et rejettent du CO₂ : c'est la respiration cellulaire." },
      { d: 4, q: "Pourquoi observe-t-on une éclipse de Soleil ?", a: ["la Lune passe entre la Terre et le Soleil", "la Terre passe entre la Lune et le Soleil", "le Soleil s'éteint", "la Lune entre dans son ombre"], c: 0,
        e: "La Lune projette son ombre sur la Terre. Quand c'est la Terre qui fait de l'ombre à la Lune, l'éclipse est lunaire." },
      { d: 5, q: "Qu'est-ce que la masse volumique ?", a: ["la masse d'un litre de matière", "le poids d'un objet", "le volume d'un corps", "la densité de l'air uniquement"], c: 0,
        e: "Masse volumique = masse ÷ volume, en g/cm³ ou kg/L. L'eau vaut 1 g/cm³." },
      { d: 5, q: "Un mélange homogène est un mélange…", a: ["dont on ne distingue pas les constituants", "qui contient plusieurs phases visibles", "toujours coloré", "toujours liquide"], c: 0,
        e: "L'eau salée est homogène ; l'eau et l'huile forment un mélange hétérogène." },
      { d: 5, q: "Quel matériau est un isolant électrique ?", a: ["le plastique", "le cuivre", "l'aluminium", "le fer"], c: 0,
        e: "Les métaux conduisent le courant grâce à leurs électrons libres ; le plastique, non — d'où les gaines de fils." },
      { d: 5, q: "Que se passe-t-il quand on dissout du sel dans l'eau ?", a: ["la masse totale se conserve", "la masse diminue", "le sel disparaît vraiment", "l'eau devient plus légère"], c: 0,
        e: "Masse de la solution = masse d'eau + masse de sel. Le sel est dispersé, pas détruit." },
      { d: 6, q: "De quoi l'air est-il principalement composé ?", a: ["78 % de diazote et 21 % de dioxygène", "100 % de dioxygène", "50 % de CO₂", "78 % de dioxygène"], c: 0,
        e: "Le reste (1 %) est surtout de l'argon, avec des traces de CO₂ et de vapeur d'eau." },
      { d: 6, q: "Qu'est-ce qu'un court-circuit ?", a: ["un chemin de très faible résistance qui contourne un dipôle", "une coupure du circuit", "un circuit trop long", "une pile déchargée"], c: 0,
        e: "L'intensité devient très forte, les fils chauffent : c'est une cause fréquente d'incendie." },
      { d: 6, q: "Une molécule est…", a: ["un assemblage d'atomes", "une particule plus petite qu'un atome", "un mélange", "un état de la matière"], c: 0,
        e: "L'eau, H₂O, associe deux atomes d'hydrogène et un atome d'oxygène." },
      { d: 6, q: "Que faut-il pour qu'une combustion se produise ?", a: ["un combustible, un comburant et une source de chaleur", "seulement du feu", "de l'eau et de l'air", "du carbone uniquement"], c: 0,
        e: "C'est le triangle du feu : supprimer un des trois côtés éteint la flamme." },
      { d: 6, q: "Dans un circuit en dérivation, si une lampe grille…", a: ["les autres restent allumées", "toutes s'éteignent", "elles brillent moins", "le circuit prend feu"], c: 0,

      { d: 7, q: "Que dit la loi d'Ohm ?", a: ["U = R × I", "U = I ÷ R", "R = U × I", "I = U × R"], c: 0,
        e: "La tension (volts) est le produit de la résistance (ohms) par l'intensité (ampères)." },
      { d: 7, q: "Quelle est l'unité de la résistance électrique ?", a: ["l'ohm (Ω)", "le volt (V)", "l'ampère (A)", "le watt (W)"], c: 0,

      { d: 7, q: "Dans un circuit en série, l'intensité du courant est…", a: ["la même en tout point", "plus forte près de la pile", "divisée entre les dipôles", "nulle après la lampe"], c: 0,

      { d: 7, q: "Quelle est la différence entre le poids et la masse ?", a: ["la masse est en kg, le poids est une force en newtons", "ce sont deux mots pour la même chose", "le poids est en kg", "la masse dépend de la planète"], c: 0,
        e: "Sur la Lune, ta masse ne change pas, mais ton poids est six fois plus faible. P = m × g." },
      { d: 7, q: "Une année-lumière mesure…", a: ["une distance", "une durée", "une vitesse", "une masse"], c: 0,
        e: "C'est la distance parcourue par la lumière en un an, environ 9 500 milliards de kilomètres." },
      { d: 8, q: "Lors d'une transformation chimique, la masse totale…", a: ["se conserve", "augmente", "diminue", "double"], c: 0,

      { d: 8, q: "Comment évolue la pression quand on descend sous l'eau ?", a: ["elle augmente avec la profondeur", "elle diminue", "elle reste constante", "elle s'annule"], c: 0,

      { d: 8, q: "Qu'est-ce qu'un ion ?", a: ["un atome qui a gagné ou perdu des électrons", "un atome neutre", "une molécule d'eau", "un noyau seul"], c: 0,
        e: "Il porte alors une charge électrique : Na⁺ a perdu un électron, Cl⁻ en a gagné un." },
      { d: 8, q: "Dans un circuit en dérivation, l'intensité principale est…", a: ["la somme des intensités des branches", "égale à celle de chaque branche", "toujours nulle", "la plus petite des deux"], c: 0,
        e: "C'est la loi des nœuds : ce qui entre dans un nœud en ressort intégralement." },
      { d: 8, q: "Quelle énergie possède un objet du fait de son mouvement ?", a: ["l'énergie cinétique", "l'énergie de position", "l'énergie thermique", "l'énergie chimique"], c: 0,
        e: "Elle dépend de la masse et surtout de la vitesse : doubler la vitesse quadruple l'énergie cinétique." },
      { d: 9, q: "Qu'est-ce que la tectonique des plaques ?", a: ["le déplacement des plaques rigides de la surface terrestre", "l'érosion des montagnes", "la formation des nuages", "la rotation de la Terre"], c: 0,
        e: "Elles s'écartent, se rapprochent ou coulissent : d'où les séismes, les volcans et les montagnes." },
      { d: 9, q: "Quelle est la différence entre un volcan effusif et un volcan explosif ?", a: ["l'effusif émet des coulées de lave fluide, l'explosif projette des nuées ardentes", "l'effusif est éteint", "l'explosif ne produit pas de lave", "il n'y en a aucune"], c: 0,
        e: "Tout tient à la viscosité du magma et à sa teneur en gaz." },
      { d: 9, q: "Où se forment les nouvelles plaques océaniques ?", a: ["au niveau des dorsales océaniques", "dans les fosses", "au centre des continents", "sous les glaciers"], c: 0,
        e: "Le magma remonte et solidifie : c'est l'expansion des fonds océaniques." },
      { d: 9, q: "Qu'appelle-t-on la magnitude d'un séisme ?", a: ["l'énergie libérée au foyer", "les dégâts observés", "la durée des secousses", "la profondeur du foyer"], c: 0,

      { d: 10, q: "Qu'est-ce qui maintient les planètes en orbite autour du Soleil ?", a: ["la gravitation", "le magnétisme", "la pression de l'air", "la lumière"], c: 0,

      { d: 10, q: "Combien de temps la lumière du Soleil met-elle pour nous parvenir ?", a: ["environ 8 minutes", "1 seconde", "1 heure", "instantanément"], c: 0,

      { d: 10, q: "Quelle source d'énergie n'est pas renouvelable ?", a: ["le gaz naturel", "l'éolien", "le solaire", "la géothermie"], c: 0,
        e: "Les énergies fossiles se sont formées en millions d'années : à notre échelle, le stock ne se reconstitue pas." },
      { d: 10, q: "Pourquoi l'ajout de CO₂ dans l'atmosphère réchauffe-t-il la Terre ?", a: ["il piège une partie du rayonnement infrarouge émis par le sol", "il bloque la lumière du Soleil", "il augmente la pression", "il détruit la couche d'ozone"], c: 0,

      { d: 10, q: "Que devient l'énergie électrique dans une lampe à filament ?", a: ["en majorité de l'énergie thermique, un peu de lumière", "entièrement en lumière", "en énergie chimique", "elle est détruite"], c: 0,
        e: "Plus de 90 % part en chaleur : c'est pourquoi ces lampes ont été remplacées par les LED." },
      { d: 5, q: "Quel organe produit les spermatozoïdes ?", a: ["les testicules", "les ovaires", "l'utérus", "la prostate"], c: 0,
        e: "Les ovaires, eux, produisent les ovules. La production commence à la puberté." },
      { d: 6, q: "Que transportent les artères ?", a: ["le sang qui sort du cœur", "le sang qui revient au cœur", "l'air", "les nutriments seulement"], c: 0,

  function logQuiz(subjectId, right, wrong) {

    entry.quiz += 1;

    entry.wrong += wrong;
    entry.subjects[subjectId] = (entry.subjects[subjectId] || 0) + 1;
    state.log[day] = entry;

    /* On ne garde que les 60 derniers jours enregistrés. */
    var days = Object.keys(state.log);
    if (days.length > 60) {
      days.sort(function (a, b) { return new Date(a) - new Date(b); });
      days.slice(0, days.length - 60).forEach(function (d) { delete state.log[d]; });
    }
  }

    /* Les questions calculées viennent en premier : leurs nombres changent à chaque quiz,
       donc elles ne s'apprennent pas par cœur. On en tire jusqu'à la moitié du quiz. */
    /* Sur un seul chapitre, les générateurs disponibles sont peu nombreux : on les
       réutilise avec de nouvelles valeurs plutôt que de rendre un quiz incomplet. */
    var wanted = Math.ceil(QUIZ_LEN * 0.7);
    var proches = makers.slice().sort(function (a, b) {
      return Math.abs(a.d - lvl) - Math.abs(b.d - lvl);
    });
    var tirage = [];
    if (proches.length) {
      var limite = chapter
        ? Math.min(wanted, proches.length * MAX_REUSE)   // un générateur ne resert pas indéfiniment
        : Math.min(wanted, proches.length);
      for (var g = 0; g < limite; g++) tirage.push(proches[g % proches.length]);
    }
    var generated = shuffle(tirage).map(function (m) { return m.make(); });

    /* Puis les questions rédigées : d'abord celles que Hugo n'a jamais vues,
       et parmi elles les plus proches du niveau visé. */
    var written = shuffle(fixed).sort(function (a, b) {
      var da = Math.abs(a.d - lvl) * 2 + (state.seen[a.q] ? 3 : 0);
      var db = Math.abs(b.d - lvl) * 2 + (state.seen[b.q] ? 3 : 0);
      return da - db;
    }).slice(0, QUIZ_LEN - generated.length);

    return shuffle(generated.concat(written)).map(function (item) {
      var right = item.a[item.c];
      var opts = shuffle(item.a);
      return { q: item.q, a: opts, c: opts.indexOf(right), e: item.e, d: item.d, gen: !!item.gen };
    });
  }

  function plumage() {

    for (var row = 0; row < halves.length; row++) {
      var y = 158 + row * 17;
      var half = halves[row];

      var offset = (row % 2) ? step / 2 : 0;
      for (var x = 120 - half + offset; x <= 120 + half - step / 2; x += step) {
        out += '<path d="M' + x.toFixed(1) + ' ' + y + ' q10.5 15 21 0" fill="none" ' +
               'stroke="#EBD3AC" stroke-opacity=".26" stroke-width="3" stroke-linecap="round"/>';
        out += '<path d="M' + x.toFixed(1) + ' ' + (y + 2.5) + ' q10.5 15 21 0" fill="none" ' +
               'stroke="#241408" stroke-opacity=".22" stroke-width="2" stroke-linecap="round"/>';

    return out;

    { id: "maths", year5: [
      { t: "Nombres relatifs", s: "Additionner, soustraire, multiplier",
        c: "Un nombre relatif porte un signe. Pour additionner deux nombres de signes contraires, on soustrait les distances à zéro et on garde le signe du plus éloigné : −7 + 12 = +5. Soustraire un nombre revient à ajouter son opposé : −5 − (−8) = −5 + 8 = 3. Pour la multiplication, deux signes identiques donnent un résultat positif, deux signes différents un résultat négatif." },
      { t: "Fractions", s: "Somme, produit, quotient, comparaison",
        c: "Pour additionner, il faut le même dénominateur : on cherche un multiple commun. Pour multiplier, on multiplie les numérateurs entre eux et les dénominateurs entre eux — pas besoin de dénominateur commun. Pour diviser, on multiplie par l'inverse. Une fraction se simplifie en divisant le haut et le bas par un même nombre." },
      { t: "Proportionnalité", s: "Pourcentages, échelles, vitesse",
        c: "Deux grandeurs sont proportionnelles si l'on passe de l'une à l'autre en multipliant toujours par le même nombre (le coefficient). Le produit en croix résout la plupart des exercices. Un pourcentage est une proportionnalité de dénominateur 100 : augmenter de 15 %, c'est multiplier par 1,15 ; diminuer de 25 %, c'est multiplier par 0,75." },
      { t: "Calcul littéral", s: "Réduire, développer, tester une égalité",
        c: "Une lettre remplace un nombre inconnu. Réduire, c'est regrouper les termes semblables : 5x + 3 − 2x + 7 = 3x + 10. Développer, c'est supprimer les parenthèses avec la distributivité : k(a + b) = ka + kb." },
      { t: "Équations du premier degré", s: "Résoudre 3x + 5 = 20",

      { t: "Aires, périmètres, volumes", s: "Triangle, disque, prisme, cylindre",
        c: "Le périmètre se mesure en cm, l'aire en cm², le volume en cm³. Erreur classique : confondre l'aire du disque (π×r²) et son périmètre (2×π×r). Pour un prisme ou un cylindre, le volume vaut toujours l'aire de la base multipliée par la hauteur." },
      { t: "Angles et triangles", s: "Somme des angles, cas particuliers",
        c: "La somme des angles d'un triangle fait toujours 180°. Dans un triangle isocèle, les deux angles à la base sont égaux ; dans un équilatéral, ils valent 60° chacun. Des angles opposés par le sommet sont égaux, des angles alternes-internes formés par deux parallèles aussi." },
      { t: "Symétries et transformations", s: "Symétrie axiale et centrale",

      { t: "Statistiques", s: "Effectifs, moyenne, étendue",
        c: "La moyenne est la somme des valeurs divisée par leur nombre. Quand chaque valeur se répète, on utilise la moyenne pondérée. L'étendue est l'écart entre la plus grande et la plus petite valeur." }
    ], year4: [
      { t: "Théorème de Pythagore", s: "Calculer un côté d'un triangle rectangle",
        c: "Dans un triangle rectangle, le carré de l'hypoténuse égale la somme des carrés des deux autres côtés. Pour trouver l'hypoténuse on additionne, pour trouver un autre côté on soustrait, puis on prend la racine carrée. La réciproque permet de démontrer qu'un triangle est rectangle." },
      { t: "Puissances", s: "Exposants positifs et négatifs, notation scientifique",
        c: "aⁿ est le produit de n facteurs égaux à a. Un exposant négatif signifie l'inverse : 10⁻³ = 0,001, ce n'est pas un nombre négatif. En notation scientifique, on écrit un seul chiffre non nul avant la virgule, multiplié par une puissance de 10." },
      { t: "Théorème de Thalès", s: "Longueurs dans deux triangles emboîtés",

      { t: "Trigonométrie", s: "Cosinus d'un angle aigu",

    { id: "francais", year5: [
      { t: "Les temps du récit", s: "Passé simple et imparfait",

      { t: "Classes grammaticales", s: "Nature des mots",

      { t: "Fonctions dans la phrase", s: "Sujet, COD, COI, attribut, compléments circonstanciels",
        c: "Le COD suit le verbe sans préposition (il lit un livre), le COI est introduit par une préposition (il parle à son frère). L'attribut du sujet se rencontre après un verbe d'état — être, sembler, devenir. Les compléments circonstanciels (temps, lieu, manière) peuvent être déplacés ou supprimés." },
      { t: "Les accords", s: "Participe passé, sujet-verbe",

      { t: "Figures de style", s: "Comparaison, métaphore, hyperbole, personnification",

      { t: "Voix active et voix passive", s: "Transformer une phrase",

      { t: "Les subordonnées", s: "Complétive, circonstancielle",
        c: "La complétive, introduite par « que », complète le verbe et répond à « quoi ? ». Les circonstancielles précisent la cause (parce que), la conséquence (si bien que), le but (pour que), le temps (quand), l'opposition (bien que — suivi du subjonctif)." },
      { t: "Le discours rapporté", s: "Direct, indirect, indirect libre",

      { t: "Loi d'Ohm", s: "U = R × I",

    { id: "anglais", year5: [

  /* ---------------- tableau de bord ----------------
     Ce qui a été fait aujourd'hui, la semaine écoulée, et le point matière par matière. */
  function dashboard() {
    var day = dayEntry(today());
    var all = totals();

    /* Sept derniers jours, du plus ancien au plus récent. */
    var week = [];
    var labels = ["dim", "lun", "mar", "mer", "jeu", "ven", "sam"];
    for (var i = 6; i >= 0; i--) {
      var date = new Date(Date.now() - i * 86400000);
      var key = date.getFullYear() + "-" + (date.getMonth() + 1) + "-" + date.getDate();
      var e = dayEntry(key);
      week.push({ label: labels[date.getDay()], answered: e.right + e.wrong, right: e.right, today: i === 0 });
    }
    var peak = Math.max.apply(null, week.map(function (d) { return d.answered; }).concat([1]));

    var bars = week.map(function (d) {
      var h = Math.round((d.answered / peak) * 100);
      return '<span class="bar' + (d.today ? " now" : "") + '" title="' + d.answered + ' questions">' +
        '<i style="height:' + (d.answered ? Math.max(h, 6) : 0) + '%"></i>' +
        '<em>' + d.label + '</em></span>';
    }).join("");

    var rows = SUBJECTS.map(function (s) {
      var lvl = levelOf(s.id);
      var best = state.best[s.id] || 0;
      var doneToday = day.subjects[s.id] || 0;
      return '<tr style="' + tint(s.id) + '">' +
        '<th scope="row"><span class="dot"></span>' + esc(s.name) + '</th>' +
        '<td>' + lvl + '/' + MAX_LEVEL + '</td>' +
        '<td>' + (best ? best + "/" + QUIZ_LEN : "—") + '</td>' +
        '<td>' + (doneToday || "—") + '</td>' +
        '</tr>';
    }).join("");

    return '' +
      '<section class="board">' +
        '<h2>Le point sur les révisions</h2>' +

        '<div class="board-today">' +
          '<div class="tile"><span class="k">Aujourd\'hui</span><span class="v">' + day.quiz + '</span>' +
            '<span class="k">' + (day.quiz > 1 ? "quiz terminés" : "quiz terminé") + '</span></div>' +
          '<div class="tile"><span class="k">Questions</span><span class="v">' + (day.right + day.wrong) + '</span>' +
            '<span class="k">répondues aujourd\'hui</span></div>' +
          '<div class="tile good"><span class="k">Justes</span><span class="v">' + day.right + '</span>' +
            '<span class="k">' + (day.right + day.wrong ? pct(day.right, day.wrong) + " % de réussite" : "rien encore") + '</span></div>' +
          '<div class="tile bad"><span class="k">Fausses</span><span class="v">' + day.wrong + '</span>' +
            '<span class="k">à revoir</span></div>' +
        '</div>' +

        '<div class="board-split">' +
          '<div class="week">' +
            '<h3>Les 7 derniers jours</h3>' +
            '<div class="bars">' + bars + '</div>' +
          '</div>' +
          '<div class="alltime">' +
            '<h3>Depuis le début</h3>' +
            '<p class="big">' + all.quiz + ' <span>quiz</span></p>' +
            '<p class="line">' + (all.right + all.wrong) + ' questions · ' +
              '<span class="ok">' + all.right + ' justes</span> · ' +
              '<span class="ko">' + all.wrong + ' fausses</span></p>' +
            '<p class="line">Réussite globale : <b>' + pct(all.right, all.wrong) + ' %</b></p>' +
          '</div>' +
        '</div>' +

        '<div class="tablewrap">' +
          '<table class="progress-table">' +
            '<caption>Progression par matière</caption>' +
            '<thead><tr><th scope="col">Matière</th><th scope="col">Niveau</th>' +
              '<th scope="col">Record</th><th scope="col">Quiz aujourd\'hui</th></tr></thead>' +
            '<tbody>' + rows + '</tbody>' +
          '</table>' +
        '</div>' +
      '</section>';
  }

  var TABS = [
    { id: "quiz",     label: "Quiz",       icon: "✏️" },
    { id: "revision", label: "Révisions 4ᵉ", icon: "🎓" },

  function tabsBar() {
    return '<nav class="tabs">' + TABS.map(function (t) {
      return '<button class="tab' + (t.id === tab ? " on" : "") + '" data-tab="' + t.id + '"' +
        ' aria-current="' + (t.id === tab ? "page" : "false") + '">' +
        '<span aria-hidden="true">' + t.icon + '</span> ' + esc(t.label) + '</button>';
    }).join("") + '</nav>';
  }

  function wireTabs() {
    Array.prototype.forEach.call(app.querySelectorAll("[data-tab]"), function (btn) {
      btn.addEventListener("click", function () {
        tab = btn.getAttribute("data-tab");
        if (tab === "quiz") renderHome();
        else if (tab === "revision") renderRevision();
        else if (tab === "formules") renderFormulas();
        else renderProgram();
      });
    });
  }

  /* ---------------- onglet Révisions 4ᵉ ---------------- */
  function renderRevision() {
    app.setAttribute("style", tint("maths"));

    /* Combien de questions disponibles pour s'entraîner sur ce chapitre. */
    function stock(chId) {
      var m = subjectById("maths");
      var gens = m.makers.filter(function (x) { return x.ch === chId; }).length;
      var ecrites = m.questions.filter(function (q) { return q.ch === chId; }).length;
      /* Longueur réelle de l'entraînement, calculée comme dans buildQuiz : un générateur
         peut resservir avec d'autres valeurs, une question rédigée ne sort qu'une fois. */
      var generees = gens ? Math.min(Math.ceil(QUIZ_LEN * 0.7), gens * MAX_REUSE) : 0;
      var taille = generees + Math.min(QUIZ_LEN - generees, ecrites);
      return { gens: gens, ecrites: ecrites, taille: taille };
    }

    var themes = [];
    MATHS_CHAPTERS.forEach(function (c) {
      if (!themes.length || themes[themes.length - 1].nom !== c.theme) {
        themes.push({ nom: c.theme, chapitres: [] });
      }
      themes[themes.length - 1].chapitres.push(c);
    });

    var numero = 0;
    var blocs = themes.map(function (t) {
      var fiches = t.chapitres.map(function (c) {
        numero++;
        var s = stock(c.id);
        var dispo = s.gens || s.ecrites;
        return '<details class="chapter">' +
          '<summary>' +
            '<span class="chnum">' + (numero < 10 ? "0" : "") + numero + '</span>' +
            '<span class="chtitle"><b>' + esc(c.t) + '</b><em>' + esc(c.goal) + '</em></span>' +
          '</summary>' +
          '<div class="chbody">' +
            '<h4>À savoir</h4>' +
            '<ul>' + c.know.map(function (k) { return '<li>' + esc(k) + '</li>'; }).join("") + '</ul>' +
            '<h4>La méthode</h4><p>' + esc(c.method) + '</p>' +
            '<h4>Les pièges</h4><p class="trap">' + esc(c.traps) + '</p>' +
            (dispo
              ? '<div class="row"><button class="btn" data-train="' + c.id + '">S\'entraîner : ' + s.taille + ' questions</button>' +
                '<span class="stock">' +
                (s.gens ? s.gens + ' générateur' + (s.gens > 1 ? "s" : "") + ' à valeurs tirées au sort' : "") +
                (s.gens && s.ecrites ? " · " : "") +
                (s.ecrites ? s.ecrites + " question" + (s.ecrites > 1 ? "s" : "") + " rédigée" + (s.ecrites > 1 ? "s" : "") : "") +
                '</span></div>'
              : '<p class="stock">Pas encore de questions sur ce chapitre — la fiche sert de cours.</p>') +
          '</div>' +
        '</details>';
      }).join("");
      return '<section class="theme"><h3>' + esc(t.nom) + '</h3>' + fiches + '</section>';
    }).join("");

    app.innerHTML = '' +
      tabsBar() +
      '<header class="pagehead">' +
        '<p class="eyebrow">Programme complet · mathématiques</p>' +
        '<h1>Ce qu\'il y a à réviser en 4ᵉ</h1>' +
        '<p class="sub">Les ' + MATHS_CHAPTERS.length + ' chapitres de l\'année, avec pour chacun le cours à savoir, ' +
          'la méthode, les pièges classiques — et un entraînement qui ne pose que des questions de ce chapitre.</p>' +
      '</header>' +
      blocs;

    wireTabs();
    Array.prototype.forEach.call(app.querySelectorAll("[data-train]"), function (btn) {
      btn.addEventListener("click", function () { startQuiz("maths", btn.getAttribute("data-train")); });
    });
    window.scrollTo(0, 0);
  }
