  /* Date courte, pour les journaux. */
  function quand(ts) {
    var d = new Date(ts);
    var jours = ["dim", "lun", "mar", "mer", "jeu", "ven", "sam"];
    return jours[d.getDay()] + " " + d.getDate() + "/" + (d.getMonth() + 1) + " à " +
      d.getHours() + "h" + (d.getMinutes() < 10 ? "0" : "") + d.getMinutes();
  }

  /* ---------------- historique des quiz ----------------
     Un quiz par ligne, du plus récent au plus ancien, avec la note obtenue. */
  function historiqueQuiz() {
    if (!state.history.length) return "";

    var lignes = state.history.slice(0, 15).map(function (h, i) {
      var s = subjectById(h.s) || { name: h.s, medal: "" };
      var numero = state.history.length - i;
      var pourcent = Math.round((h.score / h.n) * 100);
      var etat = h.score === h.n ? "parfait" : h.score >= PASS ? "reussi" : "rate";
      var quoi = h.mode === "defi" ? "Défi du jour"
        : h.mode === "chapitre" ? esc(nomChapitre(h.s, h.ch) || "Entraînement")
        : "Niveau " + h.lvl;
      return '<tr style="' + tint(h.s) + '">' +
        '<th scope="row"><span class="dot"></span>Quiz ' + numero + '</th>' +
        '<td>' + esc(s.name) + '</td>' +
        '<td class="quoi">' + quoi + '</td>' +
        '<td><b class="note ' + etat + '">' + h.score + '/' + h.n + '</b> <span class="pc">' + pourcent + ' %</span></td>' +
        '<td class="date">' + esc(quand(h.t)) + '</td>' +
        '</tr>';
    }).join("");

    return '' +
      '<div class="tablewrap">' +
        '<table class="progress-table history">' +
          '<caption>Historique des quiz — ' + state.history.length + ' au total' +
            (state.history.length > 15 ? ", les 15 derniers ci-dessous" : "") + '</caption>' +
          '<thead><tr><th scope="col">Quiz</th><th scope="col">Matière</th>' +
            '<th scope="col">Ce qui était joué</th><th scope="col">Note</th><th scope="col">Quand</th></tr></thead>' +
          '<tbody>' + lignes + '</tbody>' +
        '</table>' +
      '</div>';
  }

  /* ---------------- bilan des erreurs ----------------
     Où ça coince, matière par matière et chapitre par chapitre, puis le détail
     des dernières questions ratées avec la bonne réponse. */
  function bilanErreurs() {
    if (!state.errors.length) return "";

    var par = errorsBySubject();
    var cartes = Object.keys(par).sort(function (a, b) { return par[b].total - par[a].total; })
      .map(function (id) {
        var s = subjectById(id) || { name: id, medal: "" };
        var chapitres = Object.keys(par[id].chapitres)
          .sort(function (a, b) { return par[id].chapitres[b] - par[id].chapitres[a]; })
          .slice(0, 4)
          .map(function (c) {
            var nom = nomChapitre(id, c);
            if (!nom) return "";
            return '<li>' + esc(nom) + ' <b>' + par[id].chapitres[c] + '</b></li>';
          }).join("");
        return '<div class="faible" style="' + tint(id) + '">' +
          '<span class="k">' + s.medal + ' ' + esc(s.name) + '</span>' +
          '<span class="v">' + par[id].total + '</span>' +
          '<span class="k">erreur' + (par[id].total > 1 ? "s" : "") + '</span>' +
          (chapitres ? '<ul class="chapfaibles">' + chapitres + '</ul>' : "") +
          '</div>';
      }).join("");

    var detail = state.errors.slice(0, 25).map(function (e) {
      var s = subjectById(e.s) || { name: e.s, medal: "" };
      var chap = nomChapitre(e.s, e.ch);
      return '<details class="err" style="' + tint(e.s) + '">' +
        '<summary><span class="dot"></span><b>' + esc(e.q) + '</b></summary>' +
        '<p><span class="lab">Bonne réponse</span>' + esc(e.bonne) +
          (e.donnee ? '<br><span class="lab">Sa réponse</span><span class="fausse">' + esc(e.donnee) + '</span>' : "") +
          '<br><span class="meta">' + esc(s.name) + (chap ? " · " + esc(chap) : "") + " · " + esc(quand(e.t)) + '</span></p>' +
      '</details>';
    }).join("");

    return '' +
      '<section class="errors">' +
        '<h3>Où ça coince — ' + state.errors.length + ' erreur' + (state.errors.length > 1 ? "s" : "") +
          ' enregistrée' + (state.errors.length > 1 ? "s" : "") + '</h3>' +
        '<div class="faibles">' + cartes + '</div>' +
        '<h3>Les dernières questions ratées</h3>' +
        '<div class="errlist">' + detail + '</div>' +
        '<div class="row"><button class="btn quiet" id="viderErreurs">Effacer l\'historique des erreurs</button></div>' +
      '</section>';
  }


  /* ---------------- tableau de bord ----------------
     Ce qui a été fait aujourd'hui, la semaine écoulée, et le point matière par matière. */
  function dashboard() {
    var day = dayEntry(today());
    var all = totals();

    /* Sept derniers jours, du plus ancien au plus récent. */
    var week = [];
    var labels = ["dim", "lun", "mar", "mer", "jeu", "ven", "sam"];
    for (var i = 6; i >= 0; i--) {
      var date = new Date(Date.now() - i * 86400000);
      var key = date.getFullYear() + "-" + (date.getMonth() + 1) + "-" + date.getDate();
      var e = dayEntry(key);
      week.push({ label: labels[date.getDay()], answered: e.right + e.wrong, right: e.right, today: i === 0 });
    }
    var peak = Math.max.apply(null, week.map(function (d) { return d.answered; }).concat([1]));

    var bars = week.map(function (d) {
      var h = Math.round((d.answered / peak) * 100);
      return '<span class="bar' + (d.today ? " now" : "") + '" title="' + d.answered + ' questions">' +
        '<i style="height:' + (d.answered ? Math.max(h, 6) : 0) + '%"></i>' +
        '<em>' + d.label + '</em></span>';
    }).join("");

    var rows = SUBJECTS.map(function (s) {
      var lvl = levelOf(s.id);
      var best = state.best[s.id] || 0;
      var doneToday = day.subjects[s.id] || 0;
      return '<tr style="' + tint(s.id) + '">' +
        '<th scope="row"><span class="dot"></span>' + esc(s.name) + '</th>' +
        '<td>' + lvl + '/' + maxLevel(s.id) + '</td>' +
        '<td>' + (best ? best + "/" + QUIZ_LEN : "—") + '</td>' +
        '<td>' + (doneToday || "—") + '</td>' +
        '</tr>';
    }).join("");

    return '' +
      '<section class="board">' +
        '<h2>Le point sur les révisions</h2>' +

        '<div class="board-today">' +
          '<div class="tile"><span class="k">Aujourd\'hui</span><span class="v">' + day.quiz + '</span>' +
            '<span class="k">' + (day.quiz > 1 ? "quiz terminés" : "quiz terminé") + '</span></div>' +
          '<div class="tile"><span class="k">Questions</span><span class="v">' + (day.right + day.wrong) + '</span>' +
            '<span class="k">répondues aujourd\'hui</span></div>' +
          '<div class="tile good"><span class="k">Justes</span><span class="v">' + day.right + '</span>' +
            '<span class="k">' + (day.right + day.wrong ? pct(day.right, day.wrong) + " % de réussite" : "rien encore") + '</span></div>' +
          '<div class="tile bad"><span class="k">Fausses</span><span class="v">' + day.wrong + '</span>' +
            '<span class="k">à revoir</span></div>' +
        '</div>' +

        '<div class="board-split">' +
          '<div class="week">' +
            '<h3>Les 7 derniers jours</h3>' +
            '<div class="bars">' + bars + '</div>' +
          '</div>' +
          '<div class="alltime">' +
            '<h3>Depuis le début</h3>' +
            '<p class="big">' + all.quiz + ' <span>quiz</span></p>' +
            '<p class="line">' + (all.right + all.wrong) + ' questions · ' +
              '<span class="ok">' + all.right + ' justes</span> · ' +
              '<span class="ko">' + all.wrong + ' fausses</span></p>' +
            '<p class="line">Réussite globale : <b>' + pct(all.right, all.wrong) + ' %</b></p>' +
          '</div>' +
        '</div>' +

        historiqueQuiz() +
        bilanErreurs() +
        '<div class="tablewrap">' +
          '<table class="progress-table">' +
            '<caption>Progression par matière</caption>' +
            '<thead><tr><th scope="col">Matière</th><th scope="col">Niveau</th>' +
              '<th scope="col">Record</th><th scope="col">Quiz aujourd\'hui</th></tr></thead>' +
            '<tbody>' + rows + '</tbody>' +
          '</table>' +
        '</div>' +
      '</section>';
  }

  /* ---------------- onglets ---------------- */
  var TABS = [
    { id: "quiz",     label: "Quiz",       icon: "✏️" },
    { id: "revision", label: "Révisions 4ᵉ", icon: "🎓" },
    { id: "formules", label: "Formules",   icon: "📐" },
    { id: "programme",label: "Programme",  icon: "📚" }
  ];
  var tab = "quiz";

  function tabsBar() {
    return '<nav class="tabs">' + TABS.map(function (t) {
      return '<button class="tab' + (t.id === tab ? " on" : "") + '" data-tab="' + t.id + '"' +
        ' aria-current="' + (t.id === tab ? "page" : "false") + '">' +
        '<span aria-hidden="true">' + t.icon + '</span> ' + esc(t.label) + '</button>';
    }).join("") + '</nav>';
  }

  function wireTabs() {
    Array.prototype.forEach.call(app.querySelectorAll("[data-tab]"), function (btn) {
      btn.addEventListener("click", function () {
        tab = btn.getAttribute("data-tab");
        if (tab === "quiz") renderHome();
        else if (tab === "revision") renderRevision();
        else if (tab === "formules") renderFormulas();
        else renderProgram();
      });
    });
  }

  /* ---------------- onglet Révisions 4ᵉ ---------------- */
  var revisionSubject = "maths";

  function renderRevision() {
    var sujet = revisionSubject;
    var matiere = subjectById(sujet);
    var chapitres = CHAPTERS[sujet] || [];
    app.setAttribute("style", tint(sujet));

    /* Combien de questions disponibles pour s'entraîner sur ce chapitre. */
    function stock(chId) {
      var m = matiere;
      var gens = m.makers.filter(function (x) { return x.ch === chId; }).length;
      var ecrites = m.questions.filter(function (q) { return q.ch === chId; }).length;
      /* Longueur réelle de l'entraînement, calculée comme dans buildQuiz : un générateur
         peut resservir avec d'autres valeurs, une question rédigée ne sort qu'une fois. */
      var generees = gens ? Math.min(Math.ceil(QUIZ_LEN * 0.7), gens * MAX_REUSE) : 0;
      var taille = generees + Math.min(QUIZ_LEN - generees, ecrites);
      return { gens: gens, ecrites: ecrites, taille: taille };
    }

    var themes = [];
    chapitres.forEach(function (c) {
      if (!themes.length || themes[themes.length - 1].nom !== c.theme) {
        themes.push({ nom: c.theme, chapitres: [] });
      }
      themes[themes.length - 1].chapitres.push(c);
    });

    var numero = 0;
    var blocs = themes.map(function (t) {
      var fiches = t.chapitres.map(function (c) {
        numero++;
        var s = stock(c.id);
        var dispo = s.gens || s.ecrites;
        return '<details class="chapter">' +
          '<summary>' +
            '<span class="chnum">' + (numero < 10 ? "0" : "") + numero + '</span>' +
            '<span class="chtitle"><b>' + esc(c.t) + '</b><em>' + esc(c.goal) + '</em></span>' +
          '</summary>' +
          '<div class="chbody">' +
            '<h4>À savoir</h4>' +
            '<ul>' + c.know.map(function (k) { return '<li>' + esc(k) + '</li>'; }).join("") + '</ul>' +
            (c.schema || "") +
            '<h4>La méthode</h4><p>' + esc(c.method) + '</p>' +
            (c.exemple
              ? '<h4>Exercice type, corrigé</h4>' +
                '<div class="exo">' +
                  '<p class="enonce">' + esc(c.exemple.enonce) + '</p>' +
                  '<ol class="etapes">' + c.exemple.etapes.map(function (e) {
                    return '<li>' + esc(e) + '</li>';
                  }).join("") + '</ol>' +
                  '<p class="reponse">' + esc(c.exemple.reponse) + '</p>' +
                '</div>'
              : "") +
            '<h4>Les pièges</h4><p class="trap">' + esc(c.traps) + '</p>' +
            (dispo
              ? '<div class="row"><button class="btn" data-train="' + c.id + '">S\'entraîner : ' + s.taille + ' questions</button>' +
                '<span class="stock">' +
                (s.gens ? s.gens + ' générateur' + (s.gens > 1 ? "s" : "") + ' à valeurs tirées au sort' : "") +
                (s.gens && s.ecrites ? " · " : "") +
                (s.ecrites ? s.ecrites + " question" + (s.ecrites > 1 ? "s" : "") + " rédigée" + (s.ecrites > 1 ? "s" : "") : "") +
                '</span></div>'
              : '<p class="stock">Pas encore de questions sur ce chapitre — la fiche sert de cours.</p>') +
          '</div>' +
        '</details>';
      }).join("");
      return '<section class="theme"><h3>' + esc(t.nom) + '</h3>' + fiches + '</section>';
    }).join("");

    var choix = Object.keys(CHAPTERS).map(function (id) {
      var s = subjectById(id);
      return '<button class="pick' + (id === sujet ? " on" : "") + '" data-pick="' + id + '"' +
        ' style="' + tint(id) + '" aria-pressed="' + (id === sujet ? "true" : "false") + '">' +
        '<span aria-hidden="true">' + s.medal + '</span> ' + esc(s.name) + '</button>';
    }).join("");

    app.innerHTML = '' +
      tabsBar() +
      '<header class="pagehead">' +
        '<p class="eyebrow">Programme complet · ' + esc(matiere.name.toLowerCase()) + '</p>' +
        '<h1>Ce qu\'il y a à réviser en 4ᵉ</h1>' +
        '<p class="sub">Les ' + chapitres.length + ' chapitres de l\'année, avec pour chacun le cours à savoir, ' +
          'un schéma, la méthode, un exercice corrigé, les pièges classiques — et un entraînement qui ne pose ' +
          'que des questions de ce chapitre.</p>' +
        '<div class="picks">' + choix + '</div>' +
      '</header>' +
      blocs;

    wireTabs();
    Array.prototype.forEach.call(app.querySelectorAll("[data-pick]"), function (btn) {
      btn.addEventListener("click", function () {
        revisionSubject = btn.getAttribute("data-pick");
        renderRevision();
      });
    });
    Array.prototype.forEach.call(app.querySelectorAll("[data-train]"), function (btn) {
      btn.addEventListener("click", function () { startQuiz(sujet, btn.getAttribute("data-train")); });
    });
    window.scrollTo(0, 0);
  }

  /* ---------------- onglet Formules ---------------- */
  function renderFormulas() {
    app.removeAttribute("style");

    var groups = FORMULAS.map(function (g) {
      var rows = g.items.map(function (it) {
        return '<div class="formula">' +
          '<span class="ft">' + esc(it.t) + '</span>' +
          '<span class="ff">' + esc(it.f) + '</span>' +
          '<span class="fx">' + esc(it.x) + '</span>' +
        '</div>';
      }).join("");
      return '<section class="fgroup" style="' + tint(g.subject) + '">' +
        '<h3>' + esc(g.group) + '</h3>' + rows + '</section>';
    }).join("");

    app.innerHTML = '' +
      tabsBar() +
      '<header class="pagehead">' +
        '<p class="eyebrow">Mémento</p>' +
        '<h1>Les formules</h1>' +
        '<p class="sub">Tout ce qu\'il faut savoir par cœur, avec un exemple chiffré à chaque fois.</p>' +
      '</header>' +
      '<div class="fgrid">' + groups + '</div>';

    wireTabs();
    window.scrollTo(0, 0);
  }

  /* ---------------- onglet Programme ---------------- */
  function renderProgram() {
    app.removeAttribute("style");

    var blocks = PROGRAM.map(function (p) {
      var s = subjectById(p.id);
      function sheets(list, tagLabel, tagClass) {
        return list.map(function (f) {
          return '<details class="sheet-card">' +
            '<summary><span class="tag ' + tagClass + '">' + tagLabel + '</span>' +
              '<b>' + esc(f.t) + '</b><em>' + esc(f.s) + '</em></summary>' +
            '<p>' + esc(f.c) + '</p>' +
          '</details>';
        }).join("");
      }
      return '<section class="pblock" style="' + tint(p.id) + '">' +
        '<h3><span class="medal">' + s.medal + '</span> ' + esc(s.name) + '</h3>' +
        '<div class="sheets">' +
          sheets(p.year5, "5ᵉ", "y5") +
          sheets(p.year4, "4ᵉ", "y4") +
        '</div>' +
      '</section>';
    }).join("");

    app.innerHTML = '' +
      tabsBar() +
      '<header class="pagehead">' +
        '<p class="eyebrow">Fiches de révision</p>' +
        '<h1>Le programme</h1>' +
        '<p class="sub">Les chapitres de 5ᵉ à savoir et ceux de 4ᵉ qui arrivent. Clique sur un chapitre pour ouvrir sa fiche.</p>' +
      '</header>' +
      blocks;

    wireTabs();
    window.scrollTo(0, 0);
  }

  /* ---------------- accueil ---------------- */
  function renderHome() {
    app.removeAttribute("style");
    var done = SUBJECTS.filter(function (s) { return levelOf(s.id) >= maxLevel(s.id); }).length;

    var cards = SUBJECTS.map(function (s) {
      var best = state.best[s.id] || 0;
      var lvl = levelOf(s.id);
      var haut = maxLevel(s.id);
      var done = lvl >= haut;
      var progress = Math.round(((lvl - 1) / (haut - 1)) * 100);
      var label = best ? "record " + best + "/" + QUIZ_LEN : "jamais fait";
      var joue = playedLevel(s.id);
      /* Le sélecteur de niveau n'apparaît que s'il y a un niveau plus bas à choisir. */
      var choix = lvl > 1
        ? '<div class="levelpick">' +
            '<button class="lvlbtn" data-down="' + s.id + '"' + (joue <= 1 ? " disabled" : "") +
              ' aria-label="Niveau plus facile">−</button>' +
            '<span class="lvlnow">Jouer le niveau <b>' + joue + '</b></span>' +
            '<button class="lvlbtn" data-up="' + s.id + '"' + (joue >= lvl ? " disabled" : "") +
              ' aria-label="Niveau plus difficile">+</button>' +
            (joue < lvl ? '<span class="lvlnote">révision : ne fait pas monter</span>' : "") +
          '</div>'
        : "";

        '<div class="subject-cell">' +

            '<span class="name"><span class="medal">' + s.medal + '</span> ' + esc(s.name) + '</span>' +
            '<span class="badge">' + esc(label) + '</span>' +
          '</span>' +
          '<span class="lvl-line"><b>Niveau ' + lvl + '</b> / ' + haut +
            (done ? ' · terminé ⭐' : ' · ' + esc(LEVEL_NAMES[lvl - 1])) + '</span>' +
          '<span class="topics">' + esc(s.topics) + '</span>' +
          '<span class="track"><i style="width:' + progress + '%"></i></span>' +
          '<span class="doodle d-card" aria-hidden="true"><svg viewBox="0 0 100 100">' + DOODLES[s.id] + '</svg></span>' +
        '</button>' +
        '<div style="' + tint(s.id) + '">' + choix + '</div>' +
        '</div>';

      tabsBar() +
      '<header class="masthead">' +
        '<div class="hero-text">' +

              '<span class="askrow"><input id="who" type="text" maxlength="14" placeholder="ton prénom" autocomplete="off">' +
              '<button class="btn" id="setname">OK</button></span></div>') +

      dashboard() +

        var got = !!state.badges[b.id];
        return '<span class="award' + (got ? " got" : "") + '" title="' + esc(b.hint) + '">' +
          '<b>' + b.icon + '</b><span>' + esc(got ? b.name : b.hint) + '</span></span>';
      }).join("") + '</section>' +
      (state.played ? '<div class="row"><button class="btn quiet" id="reset">Remettre la progression à zéro</button></div>' : '');

    wireTabs();
    wireSkins();

    var who = document.getElementById("who");
    if (who) {
      var keep = function () {
        var value = who.value.trim();
        if (!value) { who.focus(); return; }
        state.name = value;
        save();
        renderHome();
      };
      document.getElementById("setname").addEventListener("click", keep);
      who.addEventListener("keydown", function (e) { if (e.key === "Enter") keep(); });
    }

    /* Choix du niveau à jouer : les flèches ne lancent pas le quiz, elles ajustent. */
    function reglerNiveau(id, delta) {
      var atteint = levelOf(id);
      var nouveau = Math.min(Math.max(playedLevel(id) + delta, 1), atteint);
      if (nouveau === atteint) delete state.chosen[id];
      else state.chosen[id] = nouveau;
      save();
      renderHome();
    }
    Array.prototype.forEach.call(app.querySelectorAll("[data-down]"), function (b) {
      b.addEventListener("click", function () { reglerNiveau(b.getAttribute("data-down"), -1); });
    });
    Array.prototype.forEach.call(app.querySelectorAll("[data-up]"), function (b) {
      b.addEventListener("click", function () { reglerNiveau(b.getAttribute("data-up"), 1); });
    });

    Array.prototype.forEach.call(app.querySelectorAll("[data-subject]"), function (btn) {
      btn.addEventListener("click", function () { startQuiz(btn.getAttribute("data-subject")); });
    });
    var vider = document.getElementById("viderErreurs");
    if (vider) {
      vider.addEventListener("click", function () {
        if (confirm("Effacer la liste des erreurs ? Les scores et les niveaux sont conservés.")) {
          state.errors = [];
          save();
          renderHome();
        }
      });
    }

    var reset = document.getElementById("reset");
    if (reset) {
      reset.addEventListener("click", function () {
        if (confirm("Effacer tes points et tes meilleurs scores ? (ton thème est conservé)")) {
          state = fill({ skin: state.skin, name: state.name });
          save();
          renderHome();
        }
      });
    }
    window.scrollTo(0, 0);
  }

  /* ---------------- quiz ---------------- */
  var run = null;

  /* Le défi du jour : une matière virtuelle qui pioche dans les cinq autres. */
  var DAILY = {
    id: "daily", medal: "🔥", name: "Défi du jour",
    topics: "Vingt questions tirées des cinq matières"
  };

  function subjectById(id) {
    if (id === "daily") return DAILY;
    return SUBJECTS.filter(function (s) { return s.id === id; })[0];
  }

  function startQuiz(id, chapter) {
    var subject = subjectById(id);
    var questions, lvl;

    /* Entraînement lancé depuis une fiche : un seul chapitre, tous niveaux confondus,
       et cela ne fait pas monter de niveau — c'est de la révision, pas une évaluation. */
    if (chapter) {
      var ch = (CHAPTERS[id] || []).filter(function (c) { return c.id === chapter; })[0];
      var entrainement = {
        id: id, medal: subject.medal,
        name: ch ? ch.t : subject.name,
        questions: subject.questions, makers: subject.makers
      };
      lvl = levelOf(id);
      run = {
        subject: entrainement, level: lvl, chapter: chapter, training: true,
        items: buildQuiz(subject, lvl, chapter), i: 0, score: 0, misses: [], answered: false
      };
      renderQuestion();
      return;
    }

    if (id === "daily") {
      /* Le défi du jour se cale sur le niveau moyen atteint dans les cinq matières. */
      lvl = Math.round(SUBJECTS.reduce(function (sum, s) { return sum + levelOf(s.id); }, 0) / SUBJECTS.length);
      questions = [];
      SUBJECTS.forEach(function (s) {
        questions = questions.concat(buildQuiz(s, lvl).slice(0, 5));
      });
      questions = shuffle(questions).slice(0, QUIZ_LEN);
    } else {
      lvl = playedLevel(id);
      questions = buildQuiz(subject, lvl);
    }

    run = { subject: subject, level: lvl, items: questions, i: 0, score: 0, misses: [], answered: false };
    renderQuestion();
  }

  function renderQuestion() {
    app.setAttribute("style", tint(run.subject.id));
    var item = run.items[run.i];
    var pct = Math.round((run.i / run.items.length) * 100);

    var answers = item.type === "saisie"
      ? '<div class="typein">' +
          '<label for="reponse">Ta réponse <em>' + esc(item.aide) + '</em></label>' +
          '<div class="typerow">' +
            '<input id="reponse" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" ' +
              'inputmode="text" placeholder="ex. 3(x + 2)">' +
            '<button class="btn" id="valider">Vérifier</button>' +
          '</div>' +
        '</div>'
      : item.a.map(function (text, idx) {
          return '<button class="answer" data-idx="' + idx + '">' +
            '<span class="key">' + "ABCD"[idx] + '</span>' +
            '<span>' + esc(text) + '</span>' +
          '</button>';
        }).join("");

    app.innerHTML = '' +
      '<div class="row"><button class="btn quiet" id="back">← ' +
        (run.training ? "Fiches de révision" : "Matières") + '</button></div>' +
      '<section class="sheet">' +
        CLIP +
        '<div class="qhead">' +
          '<span class="qcount">' + run.subject.medal + ' ' + esc(run.subject.name.toUpperCase()) +
            (run.subject.id === "daily" ? " · TOUTES MATIÈRES" : " · NIVEAU " + run.level) + '</span>' +
          '<span class="qcount">' + (run.i + 1) + ' / ' + run.items.length + '</span>' +
        '</div>' +
        '<div class="qtrack"><i style="width:' + pct + '%"></i></div>' +
        '<p class="question">' + esc(item.q) + '</p>' +
        '<div class="answers">' + answers + '</div>' +
        '<div id="after"></div>' +
      '</section>';

    document.getElementById("back").addEventListener("click", function () {
      if (run.training) { tab = "revision"; renderRevision(); } else renderHome();
    });
    Array.prototype.forEach.call(app.querySelectorAll(".answer"), function (btn) {
      btn.addEventListener("click", function () { choose(parseInt(btn.getAttribute("data-idx"), 10)); });
    });

    var champ = document.getElementById("reponse");
    if (champ) {
      var envoyer = function () { corrigeSaisie(champ.value); };
      document.getElementById("valider").addEventListener("click", envoyer);
      champ.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); envoyer(); } });
      champ.focus();
    }
    window.scrollTo(0, 0);
  }

  /* Juge une réponse écrite selon la forme attendue, et dit précisément ce qui cloche.
     Les trois modes correspondent aux trois exercices où un QCM donnerait la réponse. */
  function corrige(verif, saisie) {
    if (!saisieValide(saisie)) {
      return { juste: false, motif: "Utilise seulement des chiffres, la lettre x, des parenthèses et les signes + − × ÷." };
    }

    if (verif.mode === "equation") {
      var v = valeurSaisie(saisie);
      if (!isFinite(v)) return { juste: false, motif: "Écris seulement la valeur de x, par exemple « 4 » ou « x = 4 »." };
      if (Math.abs(v - verif.sol) > 1e-9) {
        /* Une valeur approchée montre que le raisonnement est bon : on le dit autrement. */
        return { juste: false, motif: Math.abs(v - verif.sol) < 0.02
          ? "Tu y es presque, mais c'est une valeur approchée : donne la valeur exacte, en fraction."
          : "Vérifie en remplaçant x par ta valeur dans l'équation de départ." };
      }
      return { juste: true, motif: "" };
    }

    if (!memeExpression(saisie, verif.source)) {
      return { juste: false, motif: verif.mode === "developpe"
        ? "Ton expression ne vaut pas la même chose que l'énoncé. Reprends la distributivité terme par terme."
        : "Ton expression ne vaut pas la même chose que l'énoncé. Développe ta réponse pour vérifier." };
    }

    if (verif.mode === "developpe") {
      if (!estDeveloppe(saisie)) return { juste: false, motif: "Il reste des parenthèses : il faut les développer." };
      if (!estReduit(saisie)) return { juste: false, motif: "C'est développé, mais pas réduit : il reste des termes semblables à regrouper." };
      return { juste: true, motif: "" };
    }

    if (!estFactorise(saisie)) {
      return { juste: false, motif: "C'est bien égal à l'énoncé, mais ce n'est pas factorisé : il faut un produit, avec des parenthèses." };
    }
    if (verif.pgcdMin && !facteurSuffisant(saisie, verif.pgcdMin)) {
      return { juste: false, motif: "C'est factorisé, mais pas complètement : on peut encore sortir un facteur commun." };
    }
    return { juste: true, motif: "" };
  }

  /* Correction d'une réponse écrite. */
  function corrigeSaisie(valeur) {
    if (run.answered) return;
    var item = run.items[run.i];
    var saisie = String(valeur).trim();
    var champ = document.getElementById("reponse");

    if (!saisie) { champ.focus(); return; }

    var verdict = corrige(item.verif, saisie);
    var juste = verdict.juste;
    var motif = verdict.motif;

    run.answered = true;
    if (juste) run.score++;
    else run.misses.push({ q: item.q, a: item.sol, donnee: saisie, ch: item.ch });

    champ.disabled = true;
    champ.classList.add(juste ? "good" : "bad");
    document.getElementById("valider").disabled = true;

    var last = run.i === run.items.length - 1;
    document.getElementById("after").innerHTML = '' +
      '<div class="reaction">' +
        owl(juste ? "good" : "sad") +
        '<div class="explain">' +
          '<span class="lab">' + (juste ? "Bien vu" : "À retenir") + '</span>' +
          (juste ? "" : '<span class="corrige">Réponse attendue : <b>' + esc(item.sol) + '</b><br>' + esc(motif) + '</span>') +
          esc(item.e) +
        '</div>' +
      '</div>' +
      '<div class="row"><button class="btn" id="next">' + (last ? "Voir mon score" : "Question suivante →") + '</button></div>';

    document.getElementById("next").addEventListener("click", function () {
      if (last) { finish(); return; }
      run.i++;
      run.answered = false;
      renderQuestion();
    });
    document.getElementById("next").focus();
  }

  /* Vérifie qu'on a bien sorti tout le facteur commun : le contenu des parenthèses
     ne doit plus être divisible par le facteur attendu. */
  function facteurSuffisant(saisie, k) {
    var reste = alg(saisie);
    /* On efface le contenu des parenthèses : il ne reste que le facteur sorti,
       qu'il soit écrit avant — 3(2x+5) — ou après — (2x+5)*3. */
    while (/\([^()]*\)/.test(reste)) reste = reste.replace(/\([^()]*\)/g, "P");
    var nombres = reste.match(/\d+(\.\d+)?/g) || [];
    var coef = nombres.reduce(function (a, n) { return a * parseFloat(n); }, 1);
    return coef >= k && coef % k === 0;
  }

  function choose(idx) {
    if (run.answered) return;
    run.answered = true;

    var item = run.items[run.i];
    var right = idx === item.c;
    if (right) run.score++;
    else run.misses.push({ q: item.q, a: item.a[item.c], donnee: item.a[idx], ch: item.ch });

    Array.prototype.forEach.call(app.querySelectorAll(".answer"), function (btn) {
      var i = parseInt(btn.getAttribute("data-idx"), 10);
      btn.disabled = true;
      if (i === item.c) btn.classList.add("good");
      else if (i === idx) btn.classList.add("bad");
    });

    var last = run.i === run.items.length - 1;
    document.getElementById("after").innerHTML = '' +
      '<div class="reaction">' +
        owl(right ? "good" : "sad") +
        '<div class="explain">' +
          '<span class="lab">' + (right ? "Bien vu" : "À retenir") + '</span>' + esc(item.e) +
        '</div>' +
      '</div>' +
      '<div class="row"><button class="btn" id="next">' + (last ? "Voir mon score" : "Question suivante →") + '</button></div>';

    document.getElementById("next").addEventListener("click", function () {
      if (last) { finish(); return; }
      run.i++;
      run.answered = false;
      renderQuestion();
    });
    document.getElementById("next").focus();
  }

  /* Le tampon rouge du prof, version encourageante. */
  /* Seuil de réussite proportionnel : 15/20, mais aussi 3/4 sur un entraînement court. */
  function seuil(total) {
    return total === QUIZ_LEN ? PASS : Math.ceil(total * (PASS / QUIZ_LEN));
  }

  function stamp(score, total) {
    if (score === total)         return { cls: "ok",  text: "Sans faute" };
    if (score >= seuil(total))   return { cls: "ok",  text: "Validé" };
    if (score >= total * 0.5)    return { cls: "mid", text: "Presque" };
    return { cls: "low", text: "À revoir" };
  }

  /* Copie le résumé du score. Si le presse-papier est bloqué (certains navigateurs le
     refusent dans une page intégrée), on affiche le texte tout sélectionné à copier soi-même. */
  function copy(text, btn) {
    function done(ok) {
      var box = document.getElementById("sharebox");
      if (ok) {
        btn.textContent = "Score copié ✓";
        if (box) box.innerHTML = "";
        setTimeout(function () { btn.textContent = "Copier mon score"; }, 2200);
        return;
      }
      btn.textContent = "Copier mon score";
      if (!box) return;
      box.innerHTML = '<label class="sharelab" for="sharetext">À copier toi-même :</label>' +
        '<input id="sharetext" type="text" readonly value="' + esc(text) + '">';
      var field = document.getElementById("sharetext");
      field.focus();
      field.select();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(fallback(text)); });
    } else {
      done(fallback(text));
    }
  }
  function fallback(text) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand("copy");
      ta.remove();
      return ok;
    } catch (err) { return false; }
  }

  /* Pluie de confettis aux couleurs des matières, pour un 8/8 seulement. */
  function confetti() {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    var canvas = document.createElement("canvas");
    canvas.id = "confetti";
    document.body.appendChild(canvas);

    var ctx = canvas.getContext("2d");
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.width = window.innerWidth * dpr;
    var h = canvas.height = window.innerHeight * dpr;
    ctx.scale(dpr, dpr);

    var css = getComputedStyle(document.documentElement);
    var colors = ["--c-maths", "--c-francais", "--c-anglais", "--c-histoire", "--c-svt", "--c-physique", "--marker"]
      .map(function (name) { return css.getPropertyValue(name).trim() || "#FFD54A"; });

    var bits = [];
    for (var i = 0; i < 90; i++) {
      bits.push({
        x: Math.random() * (w / dpr),
        y: -20 - Math.random() * 240,
        vy: 2.2 + Math.random() * 3.4,
        vx: -1.2 + Math.random() * 2.4,
        size: 5 + Math.random() * 7,
        rot: Math.random() * Math.PI,
        spin: -0.16 + Math.random() * 0.32,
        color: colors[i % colors.length]
      });
    }

    var start = Date.now();
    (function frame() {
      var elapsed = Date.now() - start;
      ctx.clearRect(0, 0, w, h);

      for (var i = 0; i < bits.length; i++) {
        var b = bits[i];
        b.x += b.vx; b.y += b.vy; b.rot += b.spin;
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.rot);
        ctx.globalAlpha = Math.max(0, 1 - elapsed / 2600);
        ctx.fillStyle = b.color;
        ctx.fillRect(-b.size / 2, -b.size / 4, b.size, b.size / 2);
        ctx.restore();
      }

      if (elapsed < 2600) requestAnimationFrame(frame);
      else canvas.remove();
    })();
  }

  function finish() {
    app.setAttribute("style", tint(run.subject.id));
    var s = run.score;
    var gain = s * 10 + (s === run.items.length ? 20 : 0);
    var id = run.subject.id;

    var levelUp = 0;
    if (run.training) {
      /* Entraînement sur un chapitre : on gagne des points, mais ni record ni niveau. */
    } else if (id === "daily") {
      gain += 20;                                   // le défi du jour rapporte davantage
      state.dailyDay = today();
    } else {
      if (s > (state.best[id] || 0)) state.best[id] = s;
      /* 15 bonnes réponses sur 20 font passer au niveau suivant. */
      /* On ne monte que si le quiz était bien au niveau atteint : rejouer un niveau
         plus facile sert à réviser, pas à progresser. */
      if (s >= seuil(run.items.length) && run.level >= levelOf(id) && levelOf(id) < maxLevel(id)) {
        levelUp = levelOf(id) + 1;
        state.levels[id] = levelUp;
      }
    }

    /* On note les questions rédigées déjà posées, pour servir les inédites en priorité
       la prochaine fois. Les questions calculées ne sont pas mémorisées : elles changent. */
    run.items.forEach(function (item) { if (!item.gen) state.seen[item.q] = 1; });
    /* On retient aussi le lot exact de ce quiz, pour ne pas le resservir au tour suivant. */
    state.recent[id] = run.items.filter(function (item) { return !item.gen; })
      .map(function (item) { return item.q; });

    state.xp += gain;
    state.played++;
    logQuiz(id, s, run.items.length - s);
    logErrors(id, run.chapter, run.misses);
    logRun({ s: id, ch: run.chapter || "", n: run.items.length, score: s, lvl: run.level,
             mode: run.training ? "chapitre" : (id === "daily" ? "defi" : "quiz"), t: Date.now() });
    touchStreak();
    var fresh = checkBadges();
    save();

    var n = run.items.length;
    var msg =
      s === n              ? "Sans faute. La 4ᵉ n'a qu'à bien se tenir." :
      s >= seuil(n)        ? (run.training ? "Ce chapitre est acquis." : "Niveau validé. Les questions vont se durcir.") :
      s >= n * 0.5         ? "Ça vient. Relis les explications et retente : il faut " + seuil(n) + "/" + n + "." :
                             "Ce chapitre mérite une deuxième lecture. Recommence, les questions changent.";

    /* Point sur le niveau, affiché à chaque fin de quiz : on doit toujours comprendre
       pourquoi on est monté, ou pourquoi on ne l'est pas. */
    var levelNews;
    if (run.training) {
      levelNews = '<div class="unlocked"><span class="won info"><b>🎓</b> ' +
        'Entraînement sur un seul chapitre : il rapporte des points mais ne change pas ' +
        'ton niveau. Pour monter, joue un quiz complet de la matière.</span></div>';
    } else if (run.level < levelOf(id)) {
      levelNews = '<div class="unlocked"><span class="won info"><b>↩️</b> ' +
        'Tu rejouais le niveau ' + run.level + ', plus facile que ton niveau ' + levelOf(id) +
        ' : cela ne change pas ta progression. Reviens au niveau ' + levelOf(id) + ' pour monter.</span></div>';
    } else if (id === "daily") {
      levelNews = '<div class="unlocked"><span class="won info"><b>🔥</b> ' +
        'Le défi ne change pas les niveaux des matières : il rapporte 20 points bonus. ' +
        'Pour monter d\'un niveau, joue la matière elle-même.</span></div>';
    } else if (levelUp) {
      levelNews = '<div class="unlocked"><span class="won levelup"><b>⬆️</b> ' +
        esc(run.subject.name) + ' : niveau ' + (levelUp - 1) + ' → <b>niveau ' + levelUp + '</b>' +
        (levelUp === maxLevel(id) ? " — le dernier !" : "") + '</span></div>';
    } else if (levelOf(id) >= maxLevel(id)) {
      levelNews = '<div class="unlocked"><span class="won info"><b>🏔️</b> ' +
        esc(run.subject.name) + ' : niveau ' + maxLevel(id) + ', le maximum. Rien de plus dur à débloquer.</span></div>';
    } else {
      levelNews = '<div class="unlocked"><span class="won info"><b>🎯</b> ' +
        esc(run.subject.name) + ' : toujours niveau ' + levelOf(id) + '. Il faut <b>' + seuil(n) + '/' + n +
        '</b> pour débloquer le niveau ' + (levelOf(id) + 1) + ' — il t\'en manquait ' + (seuil(n) - s) + '.</span></div>';
    }

    var unlocked = fresh.length
      ? '<div class="unlocked">' + fresh.map(function (b) {
          return '<span class="won"><b>' + b.icon + '</b> Badge débloqué · ' + esc(b.name) + '</span>';
        }).join("") + '</div>'
      : '';

    var review = run.misses.length
      ? '<div class="review"><h3>À revoir</h3>' + run.misses.map(function (m) {
          return '<p class="miss"><b>' + esc(m.q) + '</b><br>→ <span class="ans">' + esc(m.a) + '</span></p>';
        }).join("") + '</div>'
      : '';

    app.innerHTML = '' +
      '<section class="sheet">' +
        CLIP +
        '<span class="stamp ' + stamp(s, n).cls + '">' + esc(stamp(s, n).text) + '</span>' +
        '<div class="verdict">' +
          owl(s === 8 ? "win" : s >= 6 ? "good" : s >= 4 ? "idle" : "sad") +
          '<span class="qcount">' + run.subject.medal + ' ' + esc(run.subject.name.toUpperCase()) +
            (run.subject.id === "daily" ? " · TOUTES MATIÈRES" : " · NIVEAU " + run.level) + '</span>' +
          '<span class="score">' + s + '<span style="opacity:.35">/' + run.items.length + '</span></span>' +
          '<p class="msg">' + esc(msg) + '</p>' +
          '<span class="gain">+' + gain + ' points' + (s === 8 ? " (bonus sans faute inclus)" : "") +
            ' · niveau ' + level(state.xp) + ' ' + esc(rank(state.xp)) +
            (state.streak > 1 ? ' · 🔥 ' + state.streak + ' jours d\'affilée' : '') + '</span>' +
        '</div>' +
        levelNews +
        unlocked +
        review +
        '<div class="row">' +
          '<button class="btn" id="again">' + (id === "daily" ? "Refaire un défi" : "Rejouer cette matière") + '</button>' +
          '<button class="btn ghost" id="home">' +
            (run.training ? "Retour aux fiches" : "Retour aux matières") + '</button>' +
          '<button class="btn quiet" id="share">Copier mon score</button>' +
        '</div>' +
        '<div id="sharebox"></div>' +
      '</section>';

    var chapitre = run.chapter;
    document.getElementById("again").addEventListener("click", function () { startQuiz(id, chapitre); });
    var etaitEntrainement = run.training;
    document.getElementById("home").addEventListener("click", function () {
      if (etaitEntrainement) { tab = "revision"; renderRevision(); } else renderHome();
    });

    var shareBtn = document.getElementById("share");
    shareBtn.addEventListener("click", function () {
      var text = (state.name ? state.name + " — " : "") + "Objectif 4ᵉ · " + run.subject.name +
        " : " + s + "/" + run.items.length + " · niveau " + level(state.xp) + " " + rank(state.xp) +
        (state.streak > 1 ? " · " + state.streak + " jours d'affilée 🔥" : "");
      copy(text, shareBtn);
    });
    window.scrollTo(0, 0);
    if (s === run.items.length) confetti();
  }

  renderHome();
})();
</script>
