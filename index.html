<title>Objectif 4e</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=DM+Mono:wght@400;500&display=swap">

<style>
  :root {
    --ink:        #16233A;
    --ink-soft:   #56658A;
    --paper:      #F1F4FA;
    --card:       #FFFFFF;
    --rule:       #D3DCEE;
    --rule-faint: #E2E8F4;
    --blue:       #1F44C4;
    --blue-wash:  #E6EBFB;
    --marker:     #FFD54A;
    --red:        #C9392A;
    --red-wash:   #FBE7E4;
    --green:      #1F7A5C;
    --green-wash: #DFF1EA;
    --shadow:     0 1px 0 var(--rule), 0 8px 24px -18px rgba(22,35,58,.55);

    --f-display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
    --f-body:    "Newsreader", Georgia, serif;
    --f-mono:    "DM Mono", ui-monospace, monospace;

    /* Une teinte par matière, en deux versions : -l pour un fond clair, -d pour un fond sombre.
       Chaque thème choisit ensuite le jeu qui va avec son fond (--c-*). */
    --maths-l:    #1F44C4;  --maths-d:    #8FA9FF;
    --francais-l: #7B3AA8;  --francais-d: #CDA4F7;
    --anglais-l:  #BE2A72;  --anglais-d:  #FF93C8;
    --histoire-l: #8F6410;  --histoire-d: #EAC15E;
    --svt-l:      #2E7D32;  --svt-d:      #86D98F;
    --physique-l: #0E6E7A;  --physique-d: #5FD2E0;
    --daily-l:    #C2410C;  --daily-d:    #FFA366;
  }
  /* jeu clair par défaut (les thèmes sombres le remplacent plus bas) */
  :root {
    --c-maths: var(--maths-l); --c-francais: var(--francais-l); --c-anglais: var(--anglais-l);
    --c-histoire: var(--histoire-l); --c-svt: var(--svt-l); --c-physique: var(--physique-l); --c-daily: var(--daily-l);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink:        #E7ECF7;
      --ink-soft:   #97A3BE;
      --paper:      #10151F;
      --card:       #18202E;
      --rule:       #2B3547;
      --rule-faint: #222B3A;
      --blue:       #8FA9FF;
      --blue-wash:  #1D2740;
      --marker:     #FFCE3C;
      --red:        #FF8878;
      --red-wash:   #3A2220;
      --green:      #6BD6B0;
      --green-wash: #16302A;
      --shadow:     0 1px 0 var(--rule), 0 10px 28px -20px #000;
      --c-maths: var(--maths-d); --c-francais: var(--francais-d); --c-anglais: var(--anglais-d);
      --c-histoire: var(--histoire-d); --c-svt: var(--svt-d); --c-physique: var(--physique-d); --c-daily: var(--daily-d);
    }
  }
  :root[data-theme="dark"] {
    --ink:        #E7ECF7;
    --ink-soft:   #97A3BE;
    --paper:      #10151F;
    --card:       #18202E;
    --rule:       #2B3547;
    --rule-faint: #222B3A;
    --blue:       #8FA9FF;
    --blue-wash:  #1D2740;
    --marker:     #FFCE3C;
    --red:        #FF8878;
    --red-wash:   #3A2220;
    --green:      #6BD6B0;
    --green-wash: #16302A;
    --shadow:     0 1px 0 var(--rule), 0 10px 28px -20px #000;
    --c-maths: var(--maths-d); --c-francais: var(--francais-d); --c-anglais: var(--anglais-d);
    --c-histoire: var(--histoire-d); --c-svt: var(--svt-d); --c-physique: var(--physique-d); --c-daily: var(--daily-d);
  }

  /* ---------- thèmes au choix ----------
     Placés après les blocs auto : un thème choisi l'emporte sur le clair/sombre du système. */
  :root[data-skin="nuit"] {
    --ink: #E7ECF7; --ink-soft: #97A3BE; --paper: #10151F; --card: #18202E;
    --rule: #2B3547; --rule-faint: #222B3A;
    --blue: #8FA9FF; --blue-wash: #1D2740; --marker: #FFCE3C;
    --red: #FF8878; --red-wash: #3A2220; --green: #6BD6B0; --green-wash: #16302A;
    --shadow: 0 1px 0 var(--rule), 0 10px 28px -20px #000;
    --c-maths: var(--maths-d); --c-francais: var(--francais-d); --c-anglais: var(--anglais-d);
    --c-histoire: var(--histoire-d); --c-svt: var(--svt-d); --c-physique: var(--physique-d); --c-daily: var(--daily-d);
  }
  :root[data-skin="neon"] {
    --ink: #F2E9FF; --ink-soft: #9E8CC4; --paper: #0B0714; --card: #150E24;
    --rule: #2E1F4C; --rule-faint: #1D1435;
    --blue: #35E0F0; --blue-wash: #0F2E38; --marker: #FF4FD8;
    --red: #FF5470; --red-wash: #33101C; --green: #6BFFB8; --green-wash: #0B3327;
    --shadow: 0 1px 0 var(--rule), 0 12px 30px -18px #35E0F0;
    --c-maths: var(--maths-d); --c-francais: var(--francais-d); --c-anglais: var(--anglais-d);
    --c-histoire: var(--histoire-d); --c-svt: var(--svt-d); --c-physique: var(--physique-d); --c-daily: var(--daily-d);
  }
  :root[data-skin="foret"] {
    --ink: #1B2A1F; --ink-soft: #5C6E5F; --paper: #EFF3EA; --card: #FFFFFF;
    --rule: #D2DCCE; --rule-faint: #E3EADD;
    --blue: #2E5D34; --blue-wash: #E2EDE1; --marker: #E9C46A;
    --red: #B0442F; --red-wash: #F6E3DE; --green: #5FA845; --green-wash: #E6F2DE;
    --shadow: 0 1px 0 var(--rule), 0 8px 24px -18px rgba(27,42,31,.5);
    --c-maths: var(--maths-l); --c-francais: var(--francais-l); --c-anglais: var(--anglais-l);
    --c-histoire: var(--histoire-l); --c-svt: var(--svt-l); --c-physique: var(--physique-l); --c-daily: var(--daily-l);
  }
  :root[data-skin="bonbon"] {
    --ink: #3A1B33; --ink-soft: #8A6580; --paper: #FDF0F6; --card: #FFFFFF;
    --rule: #F0D3E4; --rule-faint: #F7E4EF;
    --blue: #C6317F; --blue-wash: #FBE0EF; --marker: #FFD166;
    --red: #D6455B; --red-wash: #FBE2E6; --green: #2FA37D; --green-wash: #DDF3EC;
    --shadow: 0 1px 0 var(--rule), 0 8px 24px -18px rgba(58,27,51,.45);
    --c-maths: var(--maths-l); --c-francais: var(--francais-l); --c-anglais: var(--anglais-l);
    --c-histoire: var(--histoire-l); --c-svt: var(--svt-l); --c-physique: var(--physique-l); --c-daily: var(--daily-l);
  }
  :root[data-skin="volcan"] {
    --ink: #FBEDE4; --ink-soft: #B79A88; --paper: #17100D; --card: #221713;
    --rule: #3D2A22; --rule-faint: #2A1C17;
    --blue: #FF7A3D; --blue-wash: #3A2115; --marker: #FFC24D;
    --red: #FF6B6B; --red-wash: #3A1B1B; --green: #8FD694; --green-wash: #1E3320;
    --shadow: 0 1px 0 var(--rule), 0 10px 28px -20px #000;
    --c-maths: var(--maths-d); --c-francais: var(--francais-d); --c-anglais: var(--anglais-d);
    --c-histoire: var(--histoire-d); --c-svt: var(--svt-d); --c-physique: var(--physique-d); --c-daily: var(--daily-d);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--rule-faint) 1px, transparent 1px),
      linear-gradient(90deg, var(--rule-faint) 1px, transparent 1px);
    background-size: 100% 28px, 28px 100%;
    color: var(--ink);
    font-family: var(--f-body);
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    position: relative;
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 20px 80px;
    display: flex;
    flex-direction: column;
    gap: 26px;
  }

  /* Marge de cahier : filet rouge + perforations. Escamotée sous 900 px, faute de place. */
  .wrap::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0; left: -34px;
    width: 1px;
    background: var(--red);
    opacity: .35;
  }
  .holes {
    position: absolute;
    top: 90px; left: -64px;
    display: flex;
    flex-direction: column;
    gap: 150px;
    pointer-events: none;
  }
  .holes i {
    width: 17px; height: 17px;
    border-radius: 50%;
    background: var(--paper);
    box-shadow: inset 0 1px 3px rgba(0,0,0,.35);
    border: 1px solid var(--rule);
  }
  @media (max-width: 900px) {
    .wrap::before, .holes { display: none; }
  }

  /* Gribouillis : décor pur, jamais lu à voix haute par un lecteur d'écran. */
  .doodle { position: absolute; pointer-events: none; color: var(--blue); }
  .doodle svg { display: block; width: 100%; height: 100%; }
  .doodle path, .doodle circle, .doodle line, .doodle polyline, .doodle rect, .doodle ellipse {
    fill: none;
    stroke: currentColor;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ---------- en-tête ---------- */
  .masthead {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: end;
    gap: 18px 20px;
  }
  .hero-text { position: relative; display: flex; flex-direction: column; gap: 14px; }
  @media (max-width: 640px) {
    .masthead { grid-template-columns: 1fr; }
  }
  .eyebrow {
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0;
  }
  h1 {
    font-family: var(--f-display);
    font-weight: 800;
    font-size: clamp(38px, 9vw, 62px);
    line-height: .95;
    letter-spacing: -.03em;
    margin: 0;
    text-wrap: balance;
  }
  h1 .hl {
    background: linear-gradient(transparent 58%, var(--marker) 58%, var(--marker) 92%, transparent 92%);
    padding: 0 .06em;
  }
  .sub { margin: 0; color: var(--ink-soft); max-width: 46ch; }

  /* gribouillis autour du titre */
  .d-star { top: -16px; right: 0; width: 46px; height: 46px; color: var(--marker); opacity: .9; }
  .d-bolt { top: 62px; right: 66px; width: 24px; height: 32px; color: var(--ink-soft); opacity: .5; }
  @media (max-width: 560px) {
    .d-bolt { display: none; }
    .d-star { width: 42px; height: 42px; top: -2px; }
  }

  /* motif de fond des cartes matière */
  .subject { overflow: hidden; }
  .subject > span:not(.doodle) { position: relative; z-index: 1; }
  .d-card {
    right: -14px; bottom: -18px;
    width: 108px; height: 108px;
    opacity: .14;
    z-index: 0;
    transition: transform .3s ease, opacity .3s ease;
  }
  .subject:hover .d-card { transform: rotate(-8deg) scale(1.08); opacity: .22; }

  /* trombone en haut de la feuille de quiz */
  .sheet { position: relative; }
  .d-clip {
    top: -20px; left: 22px;
    width: 26px; height: 58px;
    color: var(--ink-soft);
    opacity: .55;
    z-index: 2;
  }

  /* tampon d'appréciation sur l'écran de résultat */
  .stamp {
    position: absolute;
    top: 14px; right: 10px;
    transform: rotate(-13deg);
    border: 3px double currentColor;
    border-radius: 6px;
    padding: 6px 12px 5px;
    font-family: var(--f-mono);
    font-size: 13px;
    letter-spacing: .18em;
    text-transform: uppercase;
    opacity: .8;
    pointer-events: none;
  }
  .stamp.ok   { color: var(--green); }
  .stamp.mid  { color: var(--marker); }
  .stamp.low  { color: var(--red); }
  @media (max-width: 560px) { .stamp { font-size: 11px; padding: 5px 9px 4px; top: 10px; right: 6px; } }

  /* arrivée des cartes en cascade */
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }
  /* backwards, pas both : sinon l'état final de l'animation écraserait le transform du survol */
  .subject { animation: rise .38s ease backwards; }
  .subject:nth-child(2) { animation-delay: .05s; }
  .subject:nth-child(3) { animation-delay: .1s; }
  .subject:nth-child(4) { animation-delay: .15s; }
  .subject:nth-child(5) { animation-delay: .2s; }

  /* ---------- la mascotte ----------
     Ses couleurs sont celles d'une vraie chouette hulotte : elles ne suivent pas le thème,
     sinon l'illustration perdrait son volume. */
  .owl-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
  .owl { display: block; overflow: visible; height: auto; }
  .owl-shadow { fill: #000; opacity: .22; }

  .owl .lid {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    transform: scaleY(0);
  }
  @keyframes blink {
    0%, 91%, 100% { transform: scaleY(0); }
    94%, 96%      { transform: scaleY(1); }
  }
  .owl[data-mood="idle"] .lid { animation: blink 6.4s infinite; }
  .owl[data-mood="idle"] .lid.right { animation-delay: .06s; }

  .owl .eye-happy { display: none; }
  .owl[data-mood="good"] .eye-happy,
  .owl[data-mood="win"]  .eye-happy { display: block; }
  .owl[data-mood="good"] .eye-open,
  .owl[data-mood="win"]  .eye-open { display: none; }

  .owl[data-mood="sad"] .lid { transform: scaleY(.62); }
  .owl .tear { display: none; }
  .owl[data-mood="sad"] .tear { display: block; animation: tear 2.6s ease-in infinite; }
  @keyframes tear {
    0%   { opacity: 0; transform: translateY(0); }
    18%  { opacity: .9; }
    100% { opacity: 0; transform: translateY(34px); }
  }

  .owl .wing { transform-box: fill-box; transform-origin: 70% 12%; }
  @keyframes flap  { from { transform: rotate(0); } to { transform: rotate(-26deg); } }
  @keyframes hop   { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-16px); } }
  @keyframes tilt  { 0%, 100% { transform: rotate(0); } 40% { transform: rotate(-5deg); } }
  .owl[data-mood="win"] .wing { animation: flap .34s ease-in-out 8 alternate; }
  .owl[data-mood="win"] .figure { animation: hop .68s ease-in-out 4; }
  .owl[data-mood="good"] .figure { transform-box: fill-box; transform-origin: 50% 90%; animation: tilt 1.1s ease; }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.018); } }
  .owl[data-mood="idle"] .figure { transform-box: fill-box; transform-origin: 50% 92%; animation: breathe 4.6s ease-in-out infinite; }

  /* la mascotte et sa bulle, sur l'accueil */
  .mascot { display: flex; align-items: flex-end; gap: 10px; }
  .mascot .owl { width: 132px; }
  .bubble {
    position: relative;
    align-self: center;
    max-width: 180px;
    background: var(--card);
    border: 1.5px solid var(--rule);
    border-radius: 12px 12px 12px 3px;
    padding: 9px 12px;
    font-size: 14px;
    line-height: 1.35;
    box-shadow: var(--shadow);
  }
  .bubble::after {
    content: "";
    position: absolute;
    right: -7px; bottom: 10px;
    width: 10px; height: 10px;
    background: var(--card);
    border-right: 1.5px solid var(--rule);
    border-top: 1.5px solid var(--rule);
    transform: rotate(45deg);
  }
  @media (max-width: 640px) {
    .mascot .owl { width: 104px; }
    .bubble { max-width: 210px; font-size: 13px; }
  }

  /* la mascotte qui commente la réponse, dans le quiz */
  .reaction { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
  .reaction .owl { width: 62px; flex: none; }
  .reaction .explain { flex: 1; }
  .verdict .owl { width: 126px; margin-bottom: -6px; }

  #confetti {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 60;
  }

  /* ---------- sélecteur de thème ---------- */
  .skins { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .skins .lab {
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-right: 2px;
  }
  .skin {
    width: 30px; height: 30px;
    padding: 0;
    border-radius: 50%;
    border: 2px solid var(--rule);
    cursor: pointer;
    position: relative;
    transition: transform .14s ease, border-color .14s ease;
  }
  .skin:hover { transform: scale(1.12); }
  .skin:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  .skin[aria-pressed="true"] {
    border-color: var(--ink);
    transform: scale(1.12);
  }
  .skin[aria-pressed="true"]::after {
    content: "";
    position: absolute;
    inset: -6px;
    border: 1px solid var(--ink-soft);
    border-radius: 50%;
  }
  .skin-name {
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--ink-soft);
    margin-left: 4px;
    min-width: 5.5em;
  }

  /* ---------- barre de score ---------- */
  .scorebar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .stat {
    flex: 1 1 120px;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 11px 13px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .stat .k {
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .stat .v {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 26px;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- cartes matières ---------- */
  .grid { display: grid; gap: 12px; }
  @media (min-width: 620px) { .grid { grid-template-columns: 1fr 1fr; } }

  .subject {
    position: relative;
    text-align: left;
    font: inherit;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 16px 18px 15px;
    cursor: pointer;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 9px;
    transition: transform .14s ease, border-color .14s ease;
  }
  .subject:hover { transform: translateY(-2px); border-color: var(--blue); }
  .subject:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  .subject .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .subject .name {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 21px;
    letter-spacing: -.01em;
    color: var(--blue);
  }
  .subject .badge {
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .subject .topics { font-size: 14px; color: var(--ink-soft); line-height: 1.45; }
  .track { height: 6px; background: var(--rule-faint); border-radius: 99px; overflow: hidden; }
  .track > i { display: block; height: 100%; background: var(--blue); border-radius: 99px; transition: width .5s ease; }
  .medal { font-size: 15px; }

  /* défi du jour : même carte, mais pleine largeur et bordure marquée */
  .subject.daily {
    border-color: var(--blue);
    border-width: 2px;
    background:
      linear-gradient(135deg, var(--blue-wash) 0%, var(--card) 55%);
  }
  .subject.daily .name { font-size: 23px; }

  /* barre de progression du niveau, dans la première tuile */
  .track.lvl { margin-top: 6px; margin-bottom: 3px; }

  /* ---------- onglets ---------- */
  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--rule);
  }
  .tab {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -.01em;
    color: var(--ink-soft);
    background: transparent;
    border: 1px solid transparent;
    border-bottom: none;
    border-radius: 3px 3px 0 0;
    padding: 9px 15px;
    cursor: pointer;
    position: relative;
    top: 1px;
  }
  .tab:hover { color: var(--ink); }
  .tab:focus-visible { outline: 3px solid var(--blue); outline-offset: -2px; }
  .tab.on {
    color: var(--ink);
    background: var(--card);
    border-color: var(--rule);
    box-shadow: 0 -2px 0 var(--blue) inset;
  }
  @media (max-width: 480px) { .tab { padding: 9px 10px; font-size: 14px; } }

  .pagehead { display: flex; flex-direction: column; gap: 10px; }
  .pagehead h1 {
    font-family: var(--f-display);
    font-weight: 800;
    font-size: clamp(30px, 7vw, 46px);
    line-height: 1;
    letter-spacing: -.03em;
    margin: 0;
  }

  /* ---------- mémento des formules ---------- */
  .fgrid { display: grid; gap: 12px; }
  /* minmax(0,…) : sans lui, la formule en nowrap élargirait la colonne et ferait
     déborder toute la page horizontalement. */
  @media (min-width: 700px) {
    .fgrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  }
  .fgroup {
    background: var(--card);
    border: 1px solid var(--rule);
    border-top: 3px solid var(--blue);
    border-radius: 3px;
    box-shadow: var(--shadow);
    padding: 15px 17px;
  }
  .fgroup h3 {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 17px;
    margin: 0 0 12px;
    color: var(--blue);
  }
  .formula { padding: 9px 0; border-top: 1px solid var(--rule-faint); }
  .fgroup .formula:first-of-type { border-top: none; padding-top: 0; }
  .formula .ft {
    display: block;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 3px;
  }
  .formula .ff {
    display: block;
    font-family: var(--f-mono);
    font-size: 14px;
    background: var(--blue-wash);
    border-radius: 3px;
    padding: 5px 9px;
    margin-bottom: 4px;
    overflow-x: auto;
    white-space: nowrap;
  }
  .formula .fx { display: block; font-size: 13.5px; color: var(--ink-soft); line-height: 1.45; }

  /* sélecteur de matière dans l'onglet Révisions */
  .picks { display: flex; flex-wrap: wrap; gap: 7px; }
  .pick {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 14px;
    color: var(--ink-soft);
    background: var(--card);
    border: 1.5px solid var(--rule);
    border-radius: 99px;
    padding: 7px 15px;
    cursor: pointer;
    transition: border-color .14s ease, color .14s ease;
  }
  .pick:hover { color: var(--blue); border-color: var(--blue); }
  .pick:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .pick.on { color: var(--card); background: var(--blue); border-color: var(--blue); }

  /* ---------- chapitres de révision ---------- */
  .theme { display: flex; flex-direction: column; gap: 8px; }
  .theme h3 {
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    font-weight: 400;
    color: var(--ink-soft);
    margin: 8px 0 2px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
  }
  .chapter {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 3px;
    box-shadow: var(--shadow);
  }
  .chapter[open] { border-color: var(--blue); }
  .chapter summary {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 13px 15px;
    cursor: pointer;
    list-style: none;
  }
  .chapter summary::-webkit-details-marker { display: none; }
  .chapter summary::after {
    content: "+";
    margin-left: auto;
    font-family: var(--f-mono);
    font-size: 15px;
    color: var(--ink-soft);
  }
  .chapter[open] summary::after { content: "−"; }
  .chnum {
    font-family: var(--f-mono);
    font-size: 12px;
    color: var(--blue);
    font-variant-numeric: tabular-nums;
  }
  .chtitle { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .chtitle b {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -.01em;
  }
  .chtitle em { font-style: normal; font-size: 13.5px; color: var(--ink-soft); }

  .chbody { padding: 0 15px 15px; max-width: 70ch; }
  .chbody h4 {
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    font-weight: 400;
    color: var(--blue);
    margin: 14px 0 6px;
  }
  .chbody ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }
  .chbody li { font-size: 15.5px; line-height: 1.5; }
  .chbody p { margin: 0; font-size: 15.5px; line-height: 1.6; }
  .chbody .trap {
    border-left: 3px solid var(--marker);
    padding-left: 12px;
  }
  /* schéma de la fiche */
  .schema {
    margin: 14px 0 4px;
    padding: 14px 10px 10px;
    border: 1px solid var(--rule);
    border-radius: 3px;
    background: color-mix(in srgb, var(--blue) 4%, var(--card));
    color: var(--blue);
  }
  .schema svg { display: block; width: 100%; height: auto; max-height: 230px; }
  .schema .lbl {
    font-family: var(--f-mono);
    font-size: 12px;
    fill: var(--ink-soft);
  }
  .schema .lbl.mark { fill: var(--ink); }
  .schema .lbl.ctr, .schema .lbl.tick { text-anchor: middle; }
  .schema .frm {
    font-family: var(--f-mono);
    font-size: 14px;
    fill: var(--blue);
  }
  .schema figcaption {
    margin-top: 8px;
    font-size: 13px;
    line-height: 1.45;
    color: var(--ink-soft);
    text-align: center;
  }

  /* exercice type corrigé */
  .exo {
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 13px 15px;
    background: var(--paper);
  }
  .exo .enonce { font-weight: 500; margin-bottom: 10px; }
  .exo .etapes {
    margin: 0;
    padding-left: 20px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .exo .etapes li { font-size: 15px; line-height: 1.5; }
  .exo .etapes li::marker { font-family: var(--f-mono); font-size: 12px; color: var(--blue); }
  .exo .reponse {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--rule);
    font-family: var(--f-mono);
    font-size: 15px;
    color: var(--green);
  }

  .chbody .row { margin-top: 16px; align-items: center; }
  .stock { font-family: var(--f-mono); font-size: 11px; color: var(--ink-soft); }

  /* ---------- fiches de révision ---------- */
  .pblock {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 3px;
    box-shadow: var(--shadow);
    padding: 16px 18px;
  }
  .pblock h3 {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 21px;
    margin: 0 0 12px;
    color: var(--blue);
  }
  .sheets { display: flex; flex-direction: column; gap: 6px; }
  .sheet-card { border: 1px solid var(--rule); border-radius: 3px; }
  .sheet-card summary {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 13px;
    cursor: pointer;
    list-style: none;
  }
  .sheet-card summary::-webkit-details-marker { display: none; }
  .sheet-card summary::after {
    content: "+";
    margin-left: auto;
    font-family: var(--f-mono);
    color: var(--ink-soft);
  }
  .sheet-card[open] summary::after { content: "−"; }
  .sheet-card[open] { border-color: var(--blue); }
  .sheet-card summary b { font-weight: 500; font-size: 16px; }
  .sheet-card summary em {
    font-style: normal;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .sheet-card p {
    margin: 0;
    padding: 0 13px 13px;
    font-size: 15.5px;
    line-height: 1.6;
    max-width: 68ch;
  }
  .tag {
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: .1em;
    border-radius: 99px;
    padding: 2px 8px;
    border: 1px solid currentColor;
  }
  .tag.y5 { color: var(--ink-soft); }
  .tag.y4 { color: var(--blue); }

  /* ---------- tableau de bord ---------- */
  .board {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 3px;
    box-shadow: var(--shadow);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .board h2 {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -.01em;
    margin: 0;
  }
  .board h3 {
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    font-weight: 400;
    color: var(--ink-soft);
    margin: 0 0 10px;
  }

  .board-today { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 560px) { .board-today { grid-template-columns: repeat(2, 1fr); } }
  .tile {
    border: 1px solid var(--rule);
    border-left: 3px solid var(--ink-soft);
    border-radius: 3px;
    padding: 9px 12px;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .tile.good { border-left-color: var(--green); }
  .tile.bad  { border-left-color: var(--red); }
  .tile .k {
    font-family: var(--f-mono);
    font-size: 9.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .tile .v {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 30px;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
  }
  .tile.good .v { color: var(--green); }
  .tile.bad  .v { color: var(--red); }

  .board-split { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 560px) { .board-split { grid-template-columns: 1fr; } }

  .bars { display: flex; align-items: flex-end; gap: 6px; height: 96px; }
  .bar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; gap: 5px; }
  .bar > i {
    display: block;
    width: 100%;
    background: color-mix(in srgb, var(--blue) 45%, var(--card));
    border-radius: 2px 2px 0 0;
    min-height: 0;
    transition: height .4s ease;
  }
  .bar.now > i { background: var(--blue); }
  .bar > em {
    font-family: var(--f-mono);
    font-style: normal;
    font-size: 9.5px;
    text-align: center;
    color: var(--ink-soft);
    text-transform: uppercase;
  }
  .bar.now > em { color: var(--ink); }

  .alltime .big {
    font-family: var(--f-display);
    font-weight: 800;
    font-size: 42px;
    line-height: 1;
    margin: 0 0 6px;
    font-variant-numeric: tabular-nums;
  }
  .alltime .big span { font-size: 17px; font-weight: 500; color: var(--ink-soft); }
  .alltime .line { margin: 0 0 4px; font-size: 15px; color: var(--ink-soft); }
  .alltime .ok { color: var(--green); }
  .alltime .ko { color: var(--red); }

  .tablewrap { overflow-x: auto; }
  .progress-table { border-collapse: collapse; width: 100%; font-size: 15px; }
  .progress-table caption {
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-soft);
    text-align: left;
    padding-bottom: 8px;
  }
  .progress-table th, .progress-table td {
    text-align: left;
    padding: 8px 10px 8px 0;
    border-bottom: 1px solid var(--rule-faint);
    white-space: nowrap;
  }
  .progress-table thead th {
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 400;
  }
  .progress-table tbody th { font-weight: 500; }
  .progress-table td { font-variant-numeric: tabular-nums; color: var(--ink-soft); }
  .progress-table .dot {
    display: inline-block;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--blue);
    margin-right: 8px;
  }

  /* choix du niveau à jouer, sous la carte d'une matière */
  .subject-cell { display: flex; flex-direction: column; }
  .levelpick {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 7px 12px;
    border: 1px solid var(--rule);
    border-top: none;
    border-radius: 0 0 3px 3px;
    background: var(--card);
  }
  .lvlbtn {
    font-family: var(--f-mono);
    font-size: 15px;
    line-height: 1;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--rule);
    background: var(--card);
    color: var(--blue);
    cursor: pointer;
  }
  .lvlbtn:hover:not(:disabled) { border-color: var(--blue); }
  .lvlbtn:disabled { opacity: .35; cursor: default; }
  .lvlbtn:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .lvlnow { font-family: var(--f-mono); font-size: 12px; color: var(--ink-soft); }
  .lvlnow b { color: var(--blue); font-size: 14px; }
  .lvlnote {
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: .06em;
    color: var(--ink-soft);
    border: 1px dashed var(--rule);
    border-radius: 99px;
    padding: 2px 8px;
  }


  /* ---------- historique et erreurs ---------- */
  .progress-table.history .quoi { color: var(--ink); }
  .progress-table.history .date { font-family: var(--f-mono); font-size: 12px; }
  .note { font-family: var(--f-mono); font-size: 15px; font-weight: 500; }
  .note.parfait, .note.reussi { color: var(--green); }
  .note.rate { color: var(--red); }
  .pc { font-family: var(--f-mono); font-size: 11px; color: var(--ink-soft); }

  .errors { display: flex; flex-direction: column; gap: 12px; }
  .errors h3 {
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    font-weight: 400;
    color: var(--ink-soft);
    margin: 6px 0 0;
  }
  .faibles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .faible {
    border: 1px solid var(--rule);
    border-top: 3px solid var(--blue);
    border-radius: 3px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .faible .k {
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .faible .v {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 26px;
    line-height: 1.1;
    color: var(--blue);
    font-variant-numeric: tabular-nums;
  }
  .chapfaibles {
    margin: 8px 0 0;
    padding: 8px 0 0;
    border-top: 1px solid var(--rule-faint);
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .chapfaibles li {
    font-size: 12.5px;
    color: var(--ink-soft);
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .chapfaibles b { color: var(--ink); font-family: var(--f-mono); font-size: 12px; }

  .errlist { display: flex; flex-direction: column; gap: 5px; }
  .err { border: 1px solid var(--rule); border-radius: 3px; }
  .err[open] { border-color: var(--blue); }
  .err summary {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 9px 12px;
    cursor: pointer;
    list-style: none;
    font-size: 15px;
  }
  .err summary::-webkit-details-marker { display: none; }
  .err summary b { font-weight: 400; }
  .err p { margin: 0; padding: 0 12px 12px; font-size: 15px; line-height: 1.6; }
  .err .lab {
    display: inline-block;
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-right: 8px;
  }
  .err .fausse { color: var(--red); text-decoration: line-through; }
  .err .meta { font-family: var(--f-mono); font-size: 11px; color: var(--ink-soft); }


  /* niveau affiché sur la carte d'une matière */
  .lvl-line { font-size: 13px; color: var(--ink-soft); font-family: var(--f-mono); }
  .lvl-line b { color: var(--blue); font-weight: 500; }
  .won.levelup { border-style: solid; border-color: var(--blue); }
  .won.info { border-style: solid; border-color: var(--rule); color: var(--ink-soft); }
  .won.info b { color: var(--ink); }

  /* badges à débloquer */
  .badges { display: flex; flex-wrap: wrap; gap: 8px; }
  .award {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 99px;
    padding: 6px 13px 6px 9px;
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--ink-soft);
    opacity: .6;
  }
  .award b { font-size: 15px; filter: grayscale(1); }
  .award.got {
    opacity: 1;
    color: var(--ink);
    border-color: var(--marker);
    background: color-mix(in srgb, var(--marker) 12%, var(--card));
  }
  .award.got b { filter: none; }

  /* annonce d'un badge fraîchement décroché, sur l'écran de résultat */
  .unlocked { display: flex; flex-direction: column; gap: 8px; }
  .won {
    display: flex;
    align-items: center;
    gap: 9px;
    border: 1.5px dashed var(--marker);
    border-radius: 4px;
    padding: 9px 13px;
    font-family: var(--f-mono);
    font-size: 12px;
    letter-spacing: .05em;
    animation: rise .5s ease backwards;
  }
  .won b { font-size: 19px; }

  /* repli de partage : le texte à copier à la main */
  #sharebox:empty { display: none; }
  #sharebox { display: flex; flex-direction: column; gap: 5px; }
  .sharelab {
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  #sharetext {
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--paper);
    border: 1.5px solid var(--rule);
    border-radius: 3px;
    padding: 8px 10px;
    width: 100%;
  }

  /* champ prénom dans la bulle de la mascotte */
  .bubble label { display: block; margin-bottom: 6px; }
  .askrow { display: flex; gap: 6px; }
  .askrow input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--paper);
    border: 1.5px solid var(--rule);
    border-radius: 3px;
    padding: 5px 8px;
  }
  .askrow input:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  .askrow .btn { font-size: 14px; padding: 6px 12px; }

  /* ---------- quiz ---------- */
  .sheet {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 3px;
    box-shadow: var(--shadow);
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .qhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .qcount { font-family: var(--f-mono); font-size: 12px; color: var(--ink-soft); letter-spacing: .08em; }
  .qtrack { height: 4px; background: var(--rule-faint); border-radius: 99px; overflow: hidden; }
  .qtrack > i { display: block; height: 100%; background: var(--blue); transition: width .35s ease; }
  .sheet .qhead .qcount:first-child { color: var(--blue); }
  .question {
    font-size: clamp(20px, 4.6vw, 25px);
    line-height: 1.35;
    margin: 0;
    text-wrap: balance;
  }
  .answers { display: flex; flex-direction: column; gap: 9px; }
  .answer {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    text-align: left;
    font: inherit;
    font-size: 17px;
    color: inherit;
    background: var(--card);
    border: 1.5px solid var(--rule);
    border-radius: 3px;
    padding: 12px 14px;
    cursor: pointer;
    transition: border-color .12s ease, background .12s ease;
  }
  .answer:hover:not(:disabled) { border-color: var(--blue); background: var(--blue-wash); }
  .answer:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .answer:disabled { cursor: default; }
  .answer .key {
    font-family: var(--f-mono);
    font-size: 12px;
    line-height: 1.9;
    color: var(--ink-soft);
    min-width: 1.2em;
  }
  .answer.good { border-color: var(--green); background: var(--green-wash); }
  .answer.good .key { color: var(--green); }
  .answer.bad { border-color: var(--red); background: var(--red-wash); }
  .answer.bad .key { color: var(--red); }

  /* ---------- question à réponse écrite ---------- */
  .typein { display: flex; flex-direction: column; gap: 8px; }
  .typein label {
    font-size: 15px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: baseline;
  }
  .typein label em {
    font-style: normal;
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--ink-soft);
  }
  .typerow { display: flex; gap: 8px; flex-wrap: wrap; }
  .typerow input {
    flex: 1 1 200px;
    min-width: 0;
    font-family: var(--f-mono);
    font-size: 19px;
    color: var(--ink);
    background: var(--paper);
    border: 2px solid var(--rule);
    border-radius: 3px;
    padding: 11px 14px;
  }
  .typerow input:focus-visible { outline: 3px solid var(--blue); outline-offset: 1px; }
  .typerow input.good { border-color: var(--green); background: var(--green-wash); }
  .typerow input.bad  { border-color: var(--red);   background: var(--red-wash); }
  .typerow input:disabled { opacity: 1; }
  .corrige {
    display: block;

      { d: 8, q: "« Il est resté parce qu'il pleuvait. » Quelle est la nature de la subordonnée ?", a: ["circonstancielle de cause", "circonstancielle de but", "relative", "complétive"], c: 0,
        e: "« Parce que » introduit la cause. Le but serait introduit par « pour que »." },
      { d: 8, q: "Un narrateur qui connaît les pensées de tous les personnages adopte…", a: ["le point de vue omniscient", "le point de vue interne", "le point de vue externe", "le discours direct"], c: 0,
        e: "Interne : on suit un seul personnage. Externe : on ne voit que l'extérieur, comme une caméra." },
      { d: 8, q: "« Boire un verre » : de quelle figure s'agit-il ?", a: ["une métonymie", "une métaphore", "une hyperbole", "une comparaison"], c: 0,
        e: "La métonymie désigne une chose par une autre qui lui est liée : le contenant pour le contenu." },
      { d: 9, q: "Complète : « Bien qu'il ___ fatigué, il continue. »", a: ["soit", "est", "sera", "était"], c: 0,
        e: "« Bien que » est toujours suivi du subjonctif, même si la chose est bien réelle." },
      { d: 9, q: "Répéter un même mot en début de plusieurs vers ou phrases s'appelle…", a: ["une anaphore", "une allitération", "une gradation", "une antithèse"], c: 0,
        e: "« Rome, l'unique objet… » L'anaphore martèle et donne du rythme." },
      { d: 9, q: "« L'astre du jour » pour désigner le soleil est…", a: ["une périphrase", "une métonymie", "une litote", "un euphémisme"], c: 0,
        e: "La périphrase remplace un mot par une expression qui le décrit." },
      { d: 9, q: "Dans « Il entra. Que faire maintenant ? Il hésitait. », la question est au…", a: ["discours indirect libre", "discours direct", "discours indirect", "discours narrativisé"], c: 0,
        e: "Les pensées du personnage se glissent dans le récit sans guillemets ni « que » : c'est le discours indirect libre." },
      { d: 9, q: "« Elle s'est lavé les mains. » Pourquoi « lavé » ne s'accorde-t-il pas ?", a: ["le COD « les mains » est placé après le verbe", "le sujet est féminin", "le verbe est pronominal", "c'est une exception"], c: 0,
        e: "Avec un verbe pronominal, on accorde avec le COD seulement s'il précède le verbe. Ici il suit." },
      { d: 10, q: "« Je me meurs, je suis mort, je suis enseveli. » De quelle figure s'agit-il ?", a: ["une gradation", "une anaphore", "un oxymore", "une litote"], c: 0,
        e: "La gradation enchaîne des termes d'intensité croissante." },
      { d: 10, q: "« Ici l'ombre, là la lumière. » De quelle figure s'agit-il ?", a: ["une antithèse", "un oxymore", "une métaphore", "une périphrase"], c: 0,
        e: "L'antithèse oppose deux termes dans la même phrase. L'oxymore, lui, les colle l'un à l'autre." },
      { d: 10, q: "Dans un récit au passé, un verbe au présent sert souvent à…", a: ["rendre la scène plus vivante (présent de narration)", "indiquer une habitude", "marquer une erreur de temps", "exprimer le futur"], c: 0,
        e: "Le présent de narration met l'action sous les yeux du lecteur, comme si elle se déroulait maintenant." },
      { d: 10, q: "La répétition d'un même son consonne dans un vers s'appelle…", a: ["une allitération", "une assonance", "une anaphore", "une rime"], c: 0,
        e: "Allitération pour les consonnes (« Pour qui sont ces serpents… »), assonance pour les voyelles." },
      { d: 10, q: "Dans « Quelle chance, il pleut le jour du match ! », le registre est…", a: ["ironique", "pathétique", "épique", "comique"], c: 0,
        e: "L'ironie dit le contraire de ce qu'on pense pour se moquer de la situation." },
      { d: 6, q: "Quel est le mode du verbe dans « Prends ton cartable » ?", a: ["l'impératif", "l'indicatif", "le subjonctif", "l'infinitif"], c: 0,
        e: "L'impératif donne un ordre et se conjugue sans sujet exprimé." },
      { d: 5, q: "Quel est le synonyme le plus juste de « éphémère » ?", a: ["passager", "éternel", "immense", "fragile"], c: 0,
        e: "Éphémère = qui ne dure pas. Le contraire serait durable ou éternel." },
      { d: 4, q: "Quelle est la classe grammaticale de « celui-ci » ?", a: ["pronom démonstratif", "adjectif démonstratif", "nom commun", "adverbe"], c: 0,
        e: "Il remplace un nom : c'est un pronom. « Ce livre-ci » serait un adjectif démonstratif." }
    ],

    anglais: [
      { d: 4, q: "Complète : « I don't have ___ money. »", a: ["any", "some", "much of", "a"], c: 0,
        e: "« Some » à la forme affirmative, « any » à la forme négative et interrogative." },
      { d: 4, q: "Complète : « ___ apples do you want? »", a: ["How many", "How much", "How long", "How often"], c: 0,
        e: "« How many » pour ce qui se compte (apples), « how much » pour ce qui ne se compte pas (water)." },
      { d: 4, q: "Comment dit-on « la voiture de mon père » ?", a: ["my father's car", "the car of my father", "my father car", "the father's my car"], c: 0,
        e: "Le génitif : possesseur + 's + objet possédé." },
      { d: 5, q: "Complète : « I was born ___ 2013. »", a: ["in", "on", "at", "for"], c: 0,
        e: "« In » pour les années et les mois, « on » pour les jours, « at » pour les heures." },
      { d: 5, q: "Complète : « She is ___ tall as her brother. »", a: ["as", "so", "more", "than"], c: 0,
        e: "Comparatif d'égalité : as + adjectif + as." },
      { d: 5, q: "Où placer l'adverbe : « I ___ go to bed late. » (souvent)", a: ["often", "very", "always the", "much"], c: 0,
        e: "Les adverbes de fréquence (often, always, never) se placent avant le verbe principal." },
      { d: 5, q: "Complète : « There ___ a lot of people yesterday. »", a: ["were", "was", "are", "is"], c: 0,
        e: "« People » est un pluriel, et l'action est passée : there were." },
      { d: 6, q: "Quel est le participe passé de « take » ?", a: ["taken", "took", "taked", "taking"], c: 0,
        e: "take / took / taken. « Took » est le prétérit, « taken » s'emploie avec have." },
      { d: 6, q: "Complète : « I have lived here ___ 2019. »", a: ["since", "for", "during", "from"], c: 0,
        e: "« Since » + point de départ (2019, Monday) ; « for » + durée (three years)." },
      { d: 6, q: "Complète : « She ___ never been to London. »", a: ["has", "have", "is", "was"], c: 0,
        e: "Present perfect à la 3ᵉ personne du singulier : she has been." },
      { d: 6, q: "Que signifie « I used to play football » ?", a: ["je jouais au football (avant)", "j'utilise le football", "je joue au football", "j'ai besoin de jouer"], c: 0,
        e: "« Used to » exprime une habitude passée qui n'existe plus." },
      { d: 7, q: "Complète : « I ___ my keys. I can't open the door. »", a: ["have lost", "lost", "am losing", "was losing"], c: 0,
        e: "Le present perfect relie le passé au présent : la conséquence est actuelle." },
      { d: 7, q: "Complète : « I ___ TV when the phone rang. »", a: ["was watching", "watched", "am watching", "have watched"], c: 0,
        e: "Past continuous pour l'action en cours, prétérit simple pour l'action qui l'interrompt." },
      { d: 7, q: "Complète : « This is the man ___ lives next door. »", a: ["who", "which", "whose", "what"], c: 0,
        e: "« Who » pour les personnes, « which » pour les choses, « whose » pour la possession." },
      { d: 7, q: "Complète : « Look at the clouds! It ___ rain. »", a: ["is going to", "will", "would", "used to"], c: 0,
        e: "« Be going to » quand un indice présent annonce l'événement ; « will » pour une décision sur le moment." },
      { d: 7, q: "Quel est le prétérit de « to think » ?", a: ["thought", "thinked", "thinks", "thinking"], c: 0,
        e: "think / thought / thought. Même famille que buy / bought." },
      { d: 8, q: "Complète : « If it rains tomorrow, we ___ at home. »", a: ["will stay", "would stay", "stayed", "will to stay"], c: 0,
        e: "Conditionnel de type 1 : If + présent, will + base verbale. Jamais de « will » après « if »." },
      { d: 8, q: "Complète : « You ___ see a doctor, you look ill. »", a: ["should", "would", "could", "may"], c: 0,
        e: "« Should » donne un conseil ; « must » exprimerait une obligation forte." },
      { d: 8, q: "Quelle phrase est correcte ?", a: ["It's the most interesting book", "It's the interestingest book", "It's the more interesting book", "It's most interesting book"], c: 0,
        e: "Adjectif long : the most + adjectif. Adjectif court : -est (the biggest)." },
      { d: 8, q: "Que signifie « You don't have to come » ?", a: ["tu n'es pas obligé de venir", "tu ne dois pas venir", "il est interdit de venir", "tu ne peux pas venir"], c: 0,
        e: "« Don't have to » = absence d'obligation. L'interdiction, c'est « mustn't »." },
      { d: 8, q: "Complète : « The Mona Lisa ___ by Leonardo da Vinci. »", a: ["was painted", "painted", "is painting", "has painted"], c: 0,
        e: "Passif au prétérit : was/were + participe passé." },
      { d: 9, q: "Complète : « If I ___ rich, I would travel the world. »", a: ["were", "am", "will be", "would be"], c: 0,
        e: "Conditionnel de type 2 (situation imaginaire) : If + prétérit, would + base verbale. « Were » à toutes les personnes." },
      { d: 9, q: "Complète : « This car isn't cheap ___ for me. »", a: ["enough", "too", "very", "so"], c: 0,
        e: "« Enough » se place après l'adjectif ; « too » se place avant (too expensive)." },
      { d: 9, q: "Que signifie « to look after someone » ?", a: ["s'occuper de quelqu'un", "chercher quelqu'un", "regarder après", "ressembler à quelqu'un"], c: 0,
        e: "Look after = prendre soin de. Look for = chercher. Look like = ressembler à." },
      { d: 9, q: "Complète : « Cheese ___ from milk. »", a: ["is made", "makes", "is making", "made"], c: 0,
        e: "Passif au présent : is/are + participe passé." },
      { d: 9, q: "Complète : « I've been waiting ___ two hours. »", a: ["for", "since", "during", "from"], c: 0,
        e: "Une durée chiffrée appelle « for »." },
      { d: 10, q: "Discours rapporté : He said: « I am tired. » devient…", a: ["He said he was tired", "He said I am tired", "He said he is tired", "He says he was tired"], c: 0,
        e: "Au discours rapporté avec un verbe au passé, le présent devient prétérit et « I » devient « he »." },
      { d: 10, q: "Quelle est la différence entre « I like coffee » et « I'd like a coffee » ?", a: ["le second exprime une envie sur le moment", "les deux sont identiques", "le second est au passé", "le premier est une demande polie"], c: 0,
        e: "« I like » = goût général. « I would like » = je voudrais, maintenant." },
      { d: 10, q: "Complète : « She asked me ___ I was going. »", a: ["where", "where was", "that where", "which"], c: 0,
        e: "Dans une question rapportée, on garde l'ordre sujet + verbe : où j'allais, pas « where was I »." },
      { d: 10, q: "Que signifie « I can't stand it » ?", a: ["je ne le supporte pas", "je ne peux pas rester debout", "je ne comprends pas", "je ne peux pas l'atteindre"], c: 0,
        e: "« Can't stand » est une expression idiomatique : détester profondément." },
      { d: 10, q: "Complète : « By the time we arrived, the film ___ started. »", a: ["had", "has", "was", "would have"], c: 0,
        e: "Past perfect (had + participe passé) : une action antérieure à une autre action passée." },
      { d: 6, q: "Complète : « He is good ___ maths. »", a: ["at", "in", "on", "with"], c: 0,
        e: "L'expression figée est « to be good at something »." },
      { d: 5, q: "Quel est le pluriel de « woman » ?", a: ["women", "womans", "womens", "womanes"], c: 0,
        e: "Pluriel irrégulier, qui se prononce d'ailleurs différemment : /ˈwɪmɪn/." },
      { d: 4, q: "Complète : « ___ she like chocolate? »", a: ["Does", "Do", "Is", "Has"], c: 0,
        e: "3ᵉ personne du singulier au present simple : l'auxiliaire est « does », et le verbe reste nu." }
    ],

    histoire: [
      { d: 4, q: "Quel conflit oppose la France et l'Angleterre de 1337 à 1453 ?", a: ["la guerre de Cent Ans", "les croisades", "la guerre de Trente Ans", "la guerre des Deux-Roses"], c: 0,
        e: "Elle dura en réalité 116 ans, entrecoupée de trêves. Jeanne d'Arc y joue un rôle décisif à Orléans en 1429." },
      { d: 4, q: "En 1453, quelle ville est prise par les Ottomans ?", a: ["Constantinople", "Jérusalem", "Rome", "Venise"], c: 0,
        e: "La chute de Constantinople met fin à l'Empire byzantin ; la ville devient Istanbul." },
      { d: 4, q: "Qui réalise le premier tour du monde à partir de 1519 ?", a: ["l'expédition de Magellan", "Christophe Colomb", "Vasco de Gama", "Jacques Cartier"], c: 0,
        e: "Magellan meurt en route ; c'est Elcano qui ramène le dernier navire en 1522." },
      { d: 5, q: "Que garantit l'édit de Nantes signé en 1598 ?", a: ["la liberté de culte aux protestants", "la fin de la guerre de Cent Ans", "l'abolition de l'esclavage", "le pouvoir du Parlement"], c: 0,
        e: "Signé par Henri IV, il met fin aux guerres de Religion. Louis XIV le révoquera en 1685." },
      { d: 5, q: "Quel roi fait de Versailles le centre du pouvoir ?", a: ["Louis XIV", "François Iᵉʳ", "Henri IV", "Louis XIII"], c: 0,
        e: "Installer la cour à Versailles lui permet de surveiller la noblesse et de mettre en scène son pouvoir." },
      { d: 5, q: "Qu'est-ce que le développement durable ?", a: ["répondre aux besoins actuels sans compromettre ceux des générations futures", "produire toujours plus", "protéger uniquement la nature", "développer les pays pauvres"], c: 0,
        e: "Il croise trois piliers : économique, social et environnemental." },
      { d: 6, q: "Qu'est-ce que la traite atlantique ?", a: ["la déportation d'Africains réduits en esclavage vers l'Amérique", "le commerce des épices", "un traité de paix", "une route maritime vers l'Asie"], c: 0,
        e: "C'est le commerce triangulaire entre l'Europe, l'Afrique et l'Amérique, du XVIᵉ au XIXᵉ siècle." },
      { d: 6, q: "Qu'est-ce que la monarchie absolue ?", a: ["un régime où le roi détient tous les pouvoirs", "un régime où le roi partage le pouvoir avec un parlement", "une république", "un pouvoir exercé par l'Église"], c: 0,
        e: "Le roi tient son pouvoir de Dieu et ne le partage pas. En Angleterre, la monarchie devient au contraire parlementaire." },
      { d: 6, q: "Qui dirige la rédaction de l'Encyclopédie au XVIIIᵉ siècle ?", a: ["Diderot et d'Alembert", "Voltaire et Rousseau", "Montesquieu", "Buffon"], c: 0,
        e: "Cet immense ouvrage veut rassembler tous les savoirs et diffuser l'esprit des Lumières." },
      { d: 6, q: "Que mesure-t-on avec le PIB ?", a: ["les richesses produites dans un pays en un an", "le nombre d'habitants", "l'espérance de vie", "le niveau d'éducation"], c: 0,
        e: "Le PIB mesure la production, pas le bien-être ni les inégalités. L'IDH complète ce regard." },
      { d: 7, q: "Que se passe-t-il le 14 juillet 1789 ?", a: ["la prise de la Bastille", "la fuite du roi à Varennes", "la proclamation de la République", "l'exécution de Louis XVI"], c: 0,
        e: "La prise de cette prison-forteresse, symbole de l'arbitraire royal, devient le symbole de la Révolution." },
      { d: 7, q: "Quand est votée la Déclaration des droits de l'homme et du citoyen ?", a: ["le 26 août 1789", "le 14 juillet 1789", "en 1792", "en 1804"], c: 0,
        e: "Elle proclame que les hommes naissent libres et égaux en droits. C'est le texte fondateur de la Révolution." },
      { d: 7, q: "En quelle année la République est-elle proclamée en France ?", a: ["1792", "1789", "1793", "1799"], c: 0,
        e: "Le 21 septembre 1792, après la chute de la monarchie du 10 août." },
      { d: 7, q: "Qu'est-ce que la nuit du 4 août 1789 ?", a: ["l'abolition des privilèges", "la prise de la Bastille", "la fuite du roi", "le sacre de Napoléon"], c: 0,
        e: "Les députés votent la fin des privilèges de la noblesse et du clergé : l'Ancien Régime s'effondre." },
      { d: 8, q: "Comment Napoléon Bonaparte prend-il le pouvoir en 1799 ?", a: ["par le coup d'État du 18 Brumaire", "par une élection", "par héritage", "par un vote de l'Assemblée"], c: 0,
        e: "Il renverse le Directoire et devient Premier consul, avant de se faire sacrer empereur en 1804." },
      { d: 8, q: "Quel code, promulgué en 1804, unifie le droit français ?", a: ["le Code civil", "le Code noir", "la Constitution", "le Code pénal"], c: 0,
        e: "Toujours en vigueur aujourd'hui dans ses grandes lignes, mais il plaçait la femme sous l'autorité du mari." },
      { d: 8, q: "Où Napoléon est-il définitivement vaincu en 1815 ?", a: ["à Waterloo", "à Austerlitz", "à Trafalgar", "à Iéna"], c: 0,
        e: "Il est ensuite exilé sur l'île de Sainte-Hélène, où il meurt en 1821." },
      { d: 8, q: "Qu'est-ce que le suffrage universel masculin, instauré en France en 1848 ?", a: ["le droit de vote pour tous les hommes adultes", "le droit de vote pour tous", "le vote réservé aux plus riches", "le vote des femmes"], c: 0,
        e: "Il supprime le suffrage censitaire réservé aux contribuables aisés. Les femmes devront attendre 1944." },
      { d: 9, q: "Quelle invention symbolise la révolution industrielle du XIXᵉ siècle ?", a: ["la machine à vapeur", "l'imprimerie", "l'ordinateur", "le moteur électrique"], c: 0,
        e: "Elle fait tourner usines, trains et navires, et repose sur le charbon." },
      { d: 9, q: "Qu'est-ce que l'exode rural ?", a: ["le départ des campagnes vers les villes", "l'arrivée d'étrangers", "la fuite devant une guerre", "le retour à la campagne"], c: 0,
        e: "Au XIXᵉ siècle, les paysans partent travailler dans les usines : les villes explosent." },
      { d: 9, q: "Comment appelle-t-on les ouvriers d'usine du XIXᵉ siècle ?", a: ["le prolétariat", "la bourgeoisie", "l'aristocratie", "la paysannerie"], c: 0,
        e: "Ils n'ont que leur force de travail. Face à eux, la bourgeoisie possède les usines et le capital." },
      { d: 9, q: "Qui écrit le Manifeste du parti communiste en 1848 ?", a: ["Marx et Engels", "Jules Ferry", "Victor Hugo", "Émile Zola"], c: 0,
        e: "Ils y analysent la lutte des classes née de l'industrialisation." },
      { d: 10, q: "Que décide la conférence de Berlin de 1884-1885 ?", a: ["le partage de l'Afrique entre puissances européennes", "la fin de l'esclavage", "la création de la SDN", "l'indépendance des colonies"], c: 0,
        e: "Les Européens se répartissent l'Afrique sans consulter ses habitants : c'est l'apogée de la colonisation." },
      { d: 10, q: "Qu'est-ce que la mondialisation ?", a: ["la mise en relation croissante des territoires du monde", "la domination d'un seul pays", "la disparition des frontières", "l'uniformisation des langues"], c: 0,
        e: "Échanges de marchandises, de capitaux, d'informations et de personnes à l'échelle planétaire." },
      { d: 10, q: "Qu'appelle-t-on la littoralisation des activités ?", a: ["la concentration des hommes et des activités près des côtes", "la protection des littoraux", "l'érosion des plages", "le tourisme balnéaire"], c: 0,
        e: "Ports, zones industrielles et grandes villes se massent sur les façades maritimes, portes d'entrée du commerce mondial." },
      { d: 10, q: "Quelle est la première destination touristique mondiale ?", a: ["la France", "les États-Unis", "l'Espagne", "la Chine"], c: 0,
        e: "La France accueille le plus de touristes internationaux, même si les États-Unis en tirent plus de recettes." },
      { d: 10, q: "Qu'est-ce qu'une firme transnationale ?", a: ["une entreprise implantée dans plusieurs pays", "une entreprise d'État", "une banque internationale", "une organisation humanitaire"], c: 0,
        e: "Elle organise sa production à l'échelle mondiale pour réduire ses coûts." },
      { d: 6, q: "Qu'est-ce qu'un pays émergent ?", a: ["un pays en forte croissance économique, entre pauvreté et richesse", "un pays très pauvre", "un pays le plus riche du monde", "un pays sans industrie"], c: 0,
        e: "Chine, Inde, Brésil : leur économie décolle, mais les inégalités internes restent fortes." },
      { d: 5, q: "Qu'est-ce qu'une métropole ?", a: ["une grande ville qui concentre les fonctions de commandement", "une ville de plus de 10 millions d'habitants", "la capitale d'un pays", "une ville portuaire"], c: 0,
        e: "Elle rassemble pouvoirs politiques, économiques et culturels. Une mégapole, elle, se définit par sa taille." },
      { d: 4, q: "Qu'est-ce qu'une seigneurie au Moyen Âge ?", a: ["le domaine sur lequel un seigneur exerce son autorité", "une abbaye", "une ville libre", "un royaume"], c: 0,
        e: "Elle comprend la réserve, exploitée pour le seigneur, et les tenures cultivées par les paysans." },
      { d: 1, q: "Quelle religion se diffuse en Europe occidentale au Moyen Âge ?", a: ["le christianisme", "l'islam", "le bouddhisme", "l'hindouisme"], c: 0,
        e: "L'Église organise la vie quotidienne : baptême, mariage, fêtes, calendrier." },
      { d: 1, q: "Qui dirige un royaume au Moyen Âge ?", a: ["le roi", "le pape", "le seigneur", "le maire"], c: 0,
        e: "Le roi est au sommet, mais son autorité réelle dépend longtemps de la fidélité de ses grands vassaux." },
      { d: 2, q: "Où prie-t-on dans une abbaye ?", a: ["dans l'église abbatiale", "dans le cloître", "au réfectoire", "au dortoir"], c: 0,
        e: "Les moines suivent une règle : prière, travail et silence rythment leurs journées." },
      { d: 2, q: "Que doit le paysan à son seigneur ?", a: ["des redevances et des corvées", "seulement de l'argent", "rien du tout", "un impôt à l'État"], c: 0,
        e: "La taille, le cens, les banalités : les prélèvements sont nombreux et pèsent lourd." },
      { d: 2, q: "Qu'est-ce qu'un château fort ?", a: ["la résidence fortifiée d'un seigneur", "une église fortifiée", "une ville close", "un entrepôt à grains"], c: 0,
        e: "Il protège le seigneur, symbolise sa puissance et surveille son domaine." },

  /* ---------- questions à valeurs tirées au sort ----------
     Un générateur produit une question neuve à chaque appel : les nombres changent, donc
     la réponse ne peut pas s'apprendre par cœur. Il renvoie la bonne réponse en premier ;
     buildQuiz se charge ensuite de mélanger les propositions. */

  function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function pickOne(arr) { return arr[rnd(0, arr.length - 1)]; }

  /* Nettoie les propositions : pas de doublon, exactement quatre choix. */
  function choices(correct, wrongs) {
    var out = [String(correct)];
    for (var i = 0; i < wrongs.length && out.length < 4; i++) {
      var w = String(wrongs[i]);
      if (out.indexOf(w) === -1) out.push(w);
    }
    /* Bouche-trou : si la bonne réponse est un nombre on décale sa valeur, sinon on
       la suffixe. La borne sur pad évite toute boucle sans fin. */
    var base = Number(String(correct).replace(",", "."));
    for (var pad = 1; out.length < 4 && pad < 40; pad++) {
      var filler = isNaN(base)
        ? String(correct) + " (" + pad + ")"
        : String(correct).replace(/-?[\d.,]+/, num(base + pad * 7));
      if (out.indexOf(filler) === -1) out.push(filler);
    }
    return out;
  }

  function made(d, q, correct, wrongs, e) {
    return { d: d, q: q, a: choices(correct, wrongs), c: 0, e: e, gen: true };
  }

  /* Affiche joliment un nombre décimal à la française. */
  function num(x) {
    var r = Math.round(x * 100) / 100;
    return String(r).replace(".", ",");
  }

  /* Même chose, avec le vrai signe moins typographique. */
  function signed(x) {
    return num(x).replace("-", "−");

  function pgcd(a, b) {

  (function separeSciences() {
    var i = 0;
    while (i < SUBJECTS.length && SUBJECTS[i].id !== "sciences") i++;
    if (i === SUBJECTS.length) return;

    var sci = SUBJECTS[i];
    var svt = { id: "svt", name: "SVT", medal: "🧬",
      topics: "Corps humain, cellules, reproduction, génétique, Terre et biodiversité", questions: [] };
    var phy = { id: "physique", name: "Physique-Chimie", medal: "⚗️",
      topics: "Électricité, lumière, son, matière, chimie, forces et énergie", questions: [] };

    BASE_D.svt = [];
    BASE_D.physique = [];
    sci.questions.forEach(function (q, k) {
      var versSvt = SPLIT_SOCLE[k] === "svt";
      (versSvt ? svt : phy).questions.push(q);
      (versSvt ? BASE_D.svt : BASE_D.physique).push(BASE_D.sciences[k]);
    });

    EXTRA.svt = [];
    EXTRA.physique = [];
    (EXTRA.sciences || []).forEach(function (q, k) {
      (SPLIT_EXTRA[k] === "svt" ? EXTRA.svt : EXTRA.physique).push(q);
    });
    EXTRA.svt = EXTRA.svt.concat(NOUVEAU.svt);
    EXTRA.physique = EXTRA.physique.concat(NOUVEAU.physique);

    GENERATORS.physique = GENERATORS.sciences;   // tous les calculs sont de la physique
    SUBJECTS.splice(i, 1, svt, phy);
  })();

  /* Fusion : on étiquette le socle avec sa difficulté, puis on lui ajoute les questions
     des niveaux supérieurs. Après ça, chaque question du jeu possède un champ d. */
  SUBJECTS.forEach(function (s) {
    var levels = BASE_D[s.id] || [];
    s.questions.forEach(function (q, i) { q.d = levels[i] || 3; });
    s.questions = s.questions.concat(EXTRA[s.id] || []);
    s.makers = GENERATORS[s.id] || [];
    s.questions.forEach(function (q, i) { q.ch = (CH_Q[s.id] || [])[i]; });
    s.makers.forEach(function (m, i) { m.ch = (CH_GEN[s.id] || [])[i]; });
  });

  var LEVELS_PLUS = { maths: true };

  var STORE = "objectif4e_v1";

  var state = load();
  applySkin(state.skin);

  function load() {
    try {
      var raw = localStorage.getItem(STORE);
      if (raw) {
        var saved = JSON.parse(raw);
        return fill(saved);
      }
    } catch (err) { /* stockage indisponible : on repart à zéro */ }
    return fill({});
  }

  /* Complète une sauvegarde ancienne avec les champs ajoutés depuis. */
  function fill(s) {
    if (typeof s.xp !== "number") s.xp = 0;
    if (typeof s.played !== "number") s.played = 0;
    if (typeof s.skin !== "string") s.skin = "";
    if (typeof s.name !== "string") s.name = "";
    if (typeof s.streak !== "number") s.streak = 0;
    if (typeof s.lastDay !== "string") s.lastDay = "";
    if (typeof s.dailyDay !== "string") s.dailyDay = "";
    if (!s.best || typeof s.best !== "object") s.best = {};
    if (!s.badges || typeof s.badges !== "object") s.badges = {};
    if (!s.levels || typeof s.levels !== "object") s.levels = {};
    if (!s.log || typeof s.log !== "object") s.log = {};
    if (!s.seen || typeof s.seen !== "object") s.seen = {};
    if (!Array.isArray(s.history)) s.history = [];   // un enregistrement par quiz terminé
    if (!Array.isArray(s.errors)) s.errors = [];     // chaque question ratée, avec sa correction
    if (!s.chosen || typeof s.chosen !== "object") s.chosen = {};   // niveau choisi, s'il diffère
    if (!s.recent || typeof s.recent !== "object") s.recent = {};   // dernier lot posé, par matière
    return s;
  }

  /* Journal des quiz : on garde les 60 derniers, du plus récent au plus ancien. */
  function logRun(entry) {
    state.history.unshift(entry);
    if (state.history.length > 60) state.history.length = 60;
  }

  /* Journal des erreurs : chaque question ratée est conservée avec la bonne réponse,
     pour que Hugo — ou ses parents — voient exactement où ça coince. */
  function logErrors(subjectId, chapterId, misses) {
    var quand = Date.now();
    misses.forEach(function (m) {
      state.errors.unshift({
        s: subjectId, ch: m.ch || chapterId || "", q: m.q, bonne: m.a, donnee: m.donnee || "", t: quand
      });
    });
    if (state.errors.length > 300) state.errors.length = 300;
  }

  /* Regroupe les erreurs par matière puis par chapitre, pour repérer les points faibles. */
  function errorsBySubject() {
    var par = {};
    state.errors.forEach(function (e) {
      par[e.s] = par[e.s] || { total: 0, chapitres: {} };
      par[e.s].total++;
      var c = e.ch || "autre";
      par[e.s].chapitres[c] = (par[e.s].chapitres[c] || 0) + 1;
    });
    return par;
  }

  function nomChapitre(subjectId, chapterId) {
    var liste = CHAPTERS[subjectId] || [];
    var trouve = liste.filter(function (c) { return c.id === chapterId; })[0];
    return trouve ? trouve.t : "";
  }

  /* Journal des révisions : une ligne par jour, pour le tableau de bord. */
  function logQuiz(subjectId, right, wrong) {
    var day = today();
    var entry = state.log[day] || { quiz: 0, right: 0, wrong: 0, subjects: {} };
    entry.quiz += 1;
    entry.right += right;
    entry.wrong += wrong;
    entry.subjects[subjectId] = (entry.subjects[subjectId] || 0) + 1;
    state.log[day] = entry;

    /* On ne garde que les 60 derniers jours enregistrés. */
    var days = Object.keys(state.log);
    if (days.length > 60) {
      days.sort(function (a, b) { return new Date(a) - new Date(b); });
      days.slice(0, days.length - 60).forEach(function (d) { delete state.log[d]; });
    }
  }

  function dayEntry(key) {
    return state.log[key] || { quiz: 0, right: 0, wrong: 0, subjects: {} };
  }

  /* Cumul de tout le journal. */
  function totals() {
    var t = { quiz: 0, right: 0, wrong: 0 };
    Object.keys(state.log).forEach(function (k) {
      t.quiz += state.log[k].quiz;
      t.right += state.log[k].right;
      t.wrong += state.log[k].wrong;
    });
    return t;
  }

  function pct(right, wrong) {
    var total = right + wrong;
    return total ? Math.round((right / total) * 100) : 0;
  }

    var d = new Date();
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }
  function yesterday() {

    });
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* Prépare un quiz au niveau demandé : on garde les questions dont la difficulté est la
     plus proche du niveau, puis on mélange questions et réponses. Ainsi un quiz reste
     complet même quand un niveau ne compte pas encore assez de questions à lui seul. */
  function buildQuiz(subject, lvl, chapter) {
    var makers = subject.makers || [];
    var fixed = subject.questions || [];

    /* Entraînement ciblé : on ne garde que le chapitre demandé. */
    if (chapter) {
      makers = makers.filter(function (m) { return m.ch === chapter; });
      fixed = fixed.filter(function (q) { return q.ch === chapter; });
    }

    /* Les questions calculées viennent en premier : leurs nombres changent à chaque quiz,
       donc elles ne s'apprennent pas par cœur. Sur un seul chapitre, les générateurs sont
       peu nombreux : on les réutilise avec de nouvelles valeurs plutôt que de rendre un
       quiz incomplet. */
    var wanted = Math.ceil(QUIZ_LEN * 0.7);
    var proches = makers.slice().sort(function (a, b) {
      return Math.abs(a.d - lvl) - Math.abs(b.d - lvl);
    });
    var tirage = [];
    if (proches.length) {
      var limite = chapter
        ? Math.min(wanted, proches.length * MAX_REUSE)   // un générateur ne resert pas indéfiniment
        : Math.min(wanted, proches.length);
      for (var g = 0; g < limite; g++) tirage.push(proches[g % proches.length]);
    }
    var generated = shuffle(tirage).map(function (m) { return m.make(); });

    /* Puis les questions rédigées. Règle : on ne repose jamais une question déjà vue
       tant qu'il reste des inédites acceptables — sinon deux niveaux voisins servaient
       presque le même quiz. Quand tout le stock a été vu, on repart pour un tour. */
    var besoin = QUIZ_LEN - generated.length;
    var written = [];

    if (besoin > 0 && fixed.length) {
      var inedites = fixed.filter(function (q) { return !state.seen[q.q]; });
      if (!inedites.length) {
        /* Tout le stock a été vu : on repart pour un tour, en gardant de côté le
           dernier lot posé pour ne pas le resservir immédiatement. */
        var dernier = state.recent[subject.id] || [];
        fixed.forEach(function (q) { delete state.seen[q.q]; });
        dernier.forEach(function (texte) { state.seen[texte] = 1; });
        inedites = fixed.filter(function (q) { return !state.seen[q.q]; });
        if (!inedites.length) inedites = fixed.slice();
      }

      var parDistance = function (a, b) { return Math.abs(a.d - lvl) - Math.abs(b.d - lvl); };

      /* On élargit la fenêtre de difficulté par paliers, en restant sur les inédites. */
      for (var f = 2; f <= 10 && written.length < besoin; f++) {
        var dispo = shuffle(inedites).filter(function (q) {
          return Math.abs(q.d - lvl) <= f && written.indexOf(q) < 0;
        }).sort(parDistance);
        written = written.concat(dispo.slice(0, besoin - written.length));
      }

      /* En dernier recours seulement, on complète avec des questions déjà vues. */
      if (written.length < besoin) {
        var revues = shuffle(fixed).filter(function (q) { return written.indexOf(q) < 0; }).sort(parDistance);
        written = written.concat(revues.slice(0, besoin - written.length));
      }
    }

    return shuffle(generated.concat(written)).map(function (item) {
      if (item.type === "saisie") return item;       // rien à mélanger : la réponse s'écrit
      var right = item.a[item.c];
      var opts = shuffle(item.a);
      return { q: item.q, a: opts, c: opts.indexOf(right), e: item.e, d: item.d, ch: item.ch, gen: !!item.gen };
    });
  }

  /* Plafond de niveaux d'une matière : 10 partout, 20 en maths pour aller jusqu'au

  function playedLevel(id) {
    var choisi = state.chosen[id];
    var atteint = levelOf(id);
    if (!choisi || choisi > atteint || choisi < 1) return atteint;
    return choisi;
  }
